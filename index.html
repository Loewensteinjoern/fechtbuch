      var p = phaseById(ids[type]);
      if (!p) return;
      if (plan[type]) { p.start = plan[type][0]; p.end = plan[type][1]; }
      else { state.phases = state.phases.filter(function (x) { return x !== p; }); }
    });
  }

  /* =========================================================
     Fachlogik
     ========================================================= */
  function exById(id) { for (var i = 0; i < state.exercises.length; i++) if (state.exercises[i].id === id) return state.exercises[i]; return null; }
  function phaseById(id) { for (var i = 0; i < state.phases.length; i++) if (state.phases[i].id === id) return state.phases[i]; return null; }
  function catLabel(cat) { return CATS[cat] ? CATS[cat].label : 'Übung'; }
  function kindLabel(e) { var c = CATS[e.cat]; return c && c.kinds && e.kind && c.kinds[e.kind] ? c.kinds[e.kind] : ''; }

  function phaseFor(date) {
    var best = null;
    state.phases.forEach(function (p) {
      if (p.start <= date && date <= p.end && (!best || p.start > best.start)) best = p;
    });
    return best;
  }
  function phaseWeeks(p) { return Math.max(1, Math.ceil((diffDays(p.start, p.end) + 1) / 7)); }
  function phaseWeekNo(p, date) { return Math.floor(diffDays(p.start, date) / 7) + 1; }

  function getStatus(date, id) { var d = state.log[date]; return d && d[id] ? d[id] : null; }
  function itemsFor(date) {
    var p = phaseFor(date);
    var planned = p ? (p.days[weekday(date)] || []) : [];
    var extra = state.extra[date] || [];
    var logged = state.log[date] ? Object.keys(state.log[date]) : [];
    var seen = {};
    var out = [];
    planned.forEach(function (id) { if (!seen[id]) { seen[id] = 1; out.push({ id: id, extra: false, orphan: false }); } });
    extra.forEach(function (id) { if (!seen[id]) { seen[id] = 1; out.push({ id: id, extra: true, orphan: false }); } });
    logged.forEach(function (id) { if (!seen[id]) { seen[id] = 1; out.push({ id: id, extra: true, orphan: true }); } });
    return out.map(function (it) { it.ex = exById(it.id); it.st = getStatus(date, it.id); return it; });
  }
  function setStatus(date, id, s, r) {
    var day = state.log[date] || (state.log[date] = {});
    if (!s) {
      delete day[id];
      if (!Object.keys(day).length) delete state.log[date];
    } else {
      var ex = exById(id);
      var prev = day[id] || {};
      day[id] = { s: s, r: r || null, n: ex ? ex.name : (prev.n || ''), c: ex ? ex.cat : (prev.c || '') };
    }
    save();
    askPersistOnce();
  }
  function isExcused(st) { return !!(st && st.s === 'missed' && st.r && REASONS[st.r] && REASONS[st.r].excused); }

  function weekStats(monday) {
    var today = todayISO();
    var s = { planned: 0, due: 0, done: 0, excused: 0, missedMarked: 0, unmarked: 0, open: 0, beforeStart: 0, reasons: {}, missedNames: [] };
    for (var i = 0; i < 7; i++) {
      var d = addDays(monday, i);
      itemsFor(d).forEach(function (it) {
        var st = it.st;
        if (!st && d < state.createdAt) { s.beforeStart++; return; }
        s.planned++;
        var due = d < today || !!st;
        if (!due) { s.open++; return; }
        s.due++;
        if (st && st.s === 'done') s.done++;
        else if (isExcused(st)) { s.excused++; s.reasons[st.r] = (s.reasons[st.r] || 0) + 1; }
        else if (st && st.s === 'missed') {
          s.missedMarked++;
          var nm = it.ex ? it.ex.name : (st.n || 'Übung');
          s.missedNames.push(nm + (st.r && REASONS[st.r] ? ' (' + REASONS[st.r].label.toLowerCase() + ')' : ''));
        } else s.unmarked++;
      });
    }
    var denom = s.due - s.excused;
    s.counted = denom;
    s.quota = denom > 0 ? s.done / denom : null;
    return s;
  }
  function avgWeeks(n) {
    var m0 = mondayOf(todayISO()), done = 0, denom = 0, weeks = 0;
    for (var i = 1; i <= n; i++) {
      var s = weekStats(addDays(m0, -7 * i));
      if (s.counted > 0) { done += s.done; denom += s.counted; weeks++; }
    }
    return { q: denom > 0 ? done / denom : null, weeks: weeks };
  }
  function streak() {
    var m0 = mondayOf(todayISO()), n = 0;
    for (var i = 1; i <= 104; i++) {
      var s = weekStats(addDays(m0, -7 * i));
      if (s.counted <= 0) continue;
      if (s.quota >= STREAK_MIN) n++; else break;
    }
    return n;
  }
  function nextTournament() {
    var t = todayISO();
    return state.tournaments.filter(function (x) { return x.date && x.date >= t; })
      .sort(function (a, b) { return a.date < b.date ? -1 : 1; })[0] || null;
  }
  function tStats(t) {
    var r = t.result || {};
    var fights = (r.wins || 0) + (r.losses || 0);
    return {
      fights: fights,
      winRate: fights ? (r.wins || 0) / fights : null,
      bilPerFight: fights && r.bilateral != null ? r.bilateral / fights : null,
      balance: r.hitsFor != null && r.hitsAgainst != null ? r.hitsFor - r.hitsAgainst : null
    };
  }
  function hasResult(t) { var r = t.result || {}; return ['placement', 'wins', 'losses', 'hitsFor', 'hitsAgainst', 'bilateral', 'rating'].some(function (k) { return r[k] != null; }); }

  function ruleCheck(p) {
    var warns = [];
    function dayEx(d) { return (p.days[d] || []).map(exById).filter(Boolean); }
    for (var d = 1; d <= 7; d++) {
      var maxE = null;
      var list = dayEx(d).filter(function (e) { return CATS[e.cat] && CATS[e.cat].rank != null; });
      for (var i = 0; i < list.length; i++) {
        var e = list[i], r = CATS[e.cat].rank;
        if (maxE && r < CATS[maxE.cat].rank) {
          warns.push({ key: 'order-' + d, title: WD_LONG[d - 1] + ': ' + CATS[e.cat].label + ' nach ' + CATS[maxE.cat].label,
            text: 'Empfohlene Reihenfolge in einer Einheit: Schnelligkeit, dann Koordination und Technik, dann Kraft, Ausdauer zum Schluss. Schnelligkeit braucht einen ausgeruhten Körper.' });
          break;
        }
        if (!maxE || r > CATS[maxE.cat].rank) maxE = e;
      }
    }
    for (var a = 1; a <= 7; a++) {
      var b = a === 7 ? 1 : a + 1;
      var k1 = dayEx(a).some(function (e) { return e.cat === 'kraft' && INTENSE_KRAFT[e.kind]; });
      var k2 = dayEx(b).some(function (e) { return e.cat === 'kraft' && INTENSE_KRAFT[e.kind]; });
      if (k1 && k2) warns.push({ key: 'kraft-' + a, title: 'Kraft am ' + WD_LONG[a - 1] + ' und ' + WD_LONG[b - 1],
        text: 'Hypertrophie-, Maxkraft- und Schnellkrafttraining brauchen 48–72 Stunden Regeneration.' });
      var x1 = dayEx(a).some(function (e) { return e.cat === 'ausdauer' && INTENSE_AUSD[e.kind]; });
      var x2 = dayEx(b).some(function (e) { return e.cat === 'ausdauer' && INTENSE_AUSD[e.kind]; });
      if (x1 && x2) warns.push({ key: 'ausd-' + a, title: 'Intensive Ausdauer am ' + WD_LONG[a - 1] + ' und ' + WD_LONG[b - 1],
        text: 'Anaerobe Einheiten brauchen 36–72 Stunden, Wettkampf-Ausdauer 48–72 Stunden Regeneration.' });
    }
    return warns.map(function (w) { w.reason = (p.reasons && p.reasons[w.key]) || ''; return w; });
  }
  function openWarnings(p) { return ruleCheck(p).filter(function (w) { return !w.reason.trim(); }).length; }
  function exUsage(id) { return state.phases.filter(function (p) { for (var d = 1; d <= 7; d++) if ((p.days[d] || []).indexOf(id) >= 0) return true; return false; }).length; }

  function latestWeight() {
    var ds = Object.keys(state.weights).sort();
    if (!ds.length) return null;
    var d = ds[ds.length - 1];
    return { date: d, kg: state.weights[d] };
  }
  function backupDue() {
    var n = Object.keys(state.log).length + Object.keys(state.weights).length;
    if (n < 3) return false;
    var lb = state.settings.lastBackup;
    return !lb || diffDays(lb, todayISO()) >= 14;
  }
  function countLogs(st) { var n = 0; Object.keys(st.log).forEach(function (d) { n += Object.keys(st.log[d]).length; }); return n; }

  var persistAskedThisSession = false;
  function askPersistOnce() {
    if (persistAskedThisSession || state.settings.persistAsked) return;
    persistAskedThisSession = true;
    if (navigator.storage && navigator.storage.persist) {
      try {
        navigator.storage.persist().then(function () { state.settings.persistAsked = true; save(); }).catch(function () { /* nichts */ });
      } catch (e) { /* nichts */ }
    }
  }

  /* =========================================================
     Rendering: Rahmen
     ========================================================= */
  function render() { renderTabs(); renderView(); }
  function renderTabs() {
    $('#tabs').innerHTML = TABS.map(function (t) {
      return '<button type="button" class="tab" data-action="tab" data-tab="' + t[0] + '"' + (ui.tab === t[0] ? ' aria-current="page"' : '') + '>' + icon(t[0]) + '<span>' + t[1] + '</span></button>';
    }).join('');
  }
  function renderTopbar() {
    $('#btnSettings').innerHTML = icon('settings') + (backupDue() ? '<span class="badge-dot" aria-hidden="true"></span>' : '');
    $('#btnSettings').setAttribute('aria-label', backupDue() ? 'Einstellungen und Backup – Backup fällig' : 'Einstellungen und Backup');
  }
  var VIEWS = {
    woche: function () { return viewWoche(); },
    plan: function () { return viewPlan(); },
    diagnostik: function () { return viewDiagnostik(); },
    ziele: function () { return viewZiele(); },
    verlauf: function () { return viewVerlauf(); }
  };
  function storageBanner() {
    if (storageOK) return '';
    return '<div class="notice danger" role="alert">Speichern geht in dieser Ansicht gerade nicht. Deine Einträge gehen beim Schließen verloren. Öffne die App im Browser oder sichere sie unter Einstellungen mit „Als Text kopieren“.</div>';
  }
  function renderView() {
    if (!state) return;
    var v = $('#view');
    var a = document.activeElement, sel = null;
    if (a && v.contains(a) && a.dataset && a.dataset.action) {
      sel = '[data-action="' + a.dataset.action + '"]';
      ['id', 'date', 'tab', 'k', 'day', 'idx', 'phase'].forEach(function (k) {
        if (a.dataset[k] != null) sel += '[data-' + k + '="' + String(a.dataset[k]).replace(/"/g, '\\"') + '"]';
      });
    }
    v.innerHTML = storageBanner() + (VIEWS[ui.tab] || VIEWS.woche)();
    renderTopbar();
    if (ui.tab === 'verlauf' || ui.tab === 'ziele' || ui.tab === 'diagnostik') drawCharts();
    if (sel) { var el = v.querySelector(sel); if (el) el.focus({ preventScroll: true }); }
  }

  /* =========================================================
     Woche
     ========================================================= */
  function phaseChip(p) { return '<span class="chip ph-' + p.type + '">' + esc(PHASE_TYPES[p.type].short) + '</span>'; }

  function viewWoche() {
    var today = todayISO();
    var monday = addDays(mondayOf(today), ui.weekOffset * 7);
    var sunday = addDays(monday, 6);
    var isCurrent = ui.weekOffset === 0;
    var ref = isCurrent ? today : monday;
    var p = phaseFor(ref) || phaseFor(sunday);
    var nt = nextTournament();
    var s = weekStats(monday);
    var html = '';

    html += '<section class="week-head">' +
      '<div class="week-nav">' +
        '<button type="button" class="icon-btn" data-action="week-prev" aria-label="Vorherige Woche">' + icon('left') + '</button>' +
        '<div class="week-title"><h1 class="page-title">KW ' + isoWeek(monday) + '</h1><span class="sub">' + esc(fmtRange(monday, sunday)) + '</span></div>' +
        '<button type="button" class="icon-btn" data-action="week-next" aria-label="Nächste Woche">' + icon('right') + '</button>' +
      '</div>' +
      '<div class="phase-line">' +
        (p ? phaseChip(p) + '<span><span class="count">Woche ' + phaseWeekNo(p, p.start > monday ? p.start : ref) + ' von ' + phaseWeeks(p) + '</span>' + (p.name !== PHASE_TYPES[p.type].label ? ' · ' + esc(p.name) : '') + '</span>' : '<span>Keine Phase in dieser Woche</span>') +
        (nt ? '<span class="t-count">' + icon('trophy') + esc(nt.name) + ' ' + inDays(diffDays(today, nt.date)) + '</span>' : '') +
      '</div>' +
      (!isCurrent ? '<div><button type="button" class="btn small" data-action="week-today">Zur aktuellen Woche</button></div>' : '') +
    '</section>';

    if (!state.phases.length) {
      html += '<section class="card"><div class="eyebrow">Noch kein Plan</div><h2 class="h2">Leg deine erste Phase an</h2>' +
        '<p class="muted">Eine Phase hat eine Wochenvorlage, die sich jede Woche wiederholt. Du kannst auch mit einem Beispielplan starten und ihn anpassen.</p>' +
        '<div class="actions"><button type="button" class="btn primary" data-action="new-phase">' + icon('plus') + 'Phase anlegen</button><button type="button" class="btn" data-action="load-example">Beispielplan laden</button></div></section>';
    } else if (state.settings.welcome && state.settings.example) {
      html += welcomeCard();
    }

    if (isCurrent && backupDue()) {
      var lb = state.settings.lastBackup;
      html += '<div class="notice"><span>' + (lb ? 'Letztes Backup vor ' + diffDays(lb, today) + ' Tagen.' : 'Du hast noch kein Backup gespeichert.') + '</span><button type="button" class="btn small" data-action="settings">Jetzt sichern</button></div>';
    }

    html += summaryCard(s, monday, isCurrent);
    if (isCurrent) {
      var dueGoals = reviewDueGoals();
      if (dueGoals.length) html += '<div class="notice info"><span>' + dueGoals.length + ' ' + plural(dueGoals.length, 'Ziel wartet', 'Ziele warten') + ' auf eine Rückschau.</span><button type="button" class="btn small" data-action="tab" data-tab="ziele">Ansehen</button></div>';
      html += techCard();
      html += weightCard(today);
    }

    html += '<section class="days" aria-label="Trainingstage">';
    for (var i = 0; i < 7; i++) html += dayCard(addDays(monday, i), today);
    html += '</section>';
    return html;
  }

  function welcomeCard() {
    if (ui.confirmEmpty) {
      return '<section class="card welcome"><div class="eyebrow">Leer starten</div><h2 class="h2">Beispielplan löschen?</h2>' +
        '<p>Phasen, Übungen und bisherige Häkchen des Beispielplans werden entfernt. Gewicht und Turniere bleiben.</p>' +
        '<div class="actions"><button type="button" class="btn primary" data-action="welcome-empty-confirm">Ja, leer starten</button><button type="button" class="btn" data-action="welcome-empty-cancel">Abbrechen</button></div></section>';
    }
    return '<section class="card welcome"><div class="eyebrow">Willkommen</div><h2 class="h2">Dein Fechtbuch ist startklar</h2>' +
      '<p>Zum Ausprobieren steckt ein Beispielplan drin: allgemeine Vorbereitung, spezielle Vorbereitung, Wettkampf und eine Woche Pause, jeweils mit typischer Trainingswoche. Trag dein nächstes Turnier ein, dann werden die Phasen danach ausgerichtet. Ändern kannst du alles unter „Plan“.</p>' +
      '<div class="actions"><button type="button" class="btn primary" data-action="welcome-tournament">' + icon('trophy') + 'Turnier eintragen</button><button type="button" class="btn" data-action="welcome-empty">Leer starten</button></div>' +
      '<button type="button" class="icon-btn close" data-action="welcome-dismiss" aria-label="Hinweis ausblenden">' + icon('cross') + '</button></section>';
  }

  function summaryCard(s, monday, isCurrent) {
    var future = monday > todayISO();
    var eyebrow = isCurrent ? 'Diese Woche' : future ? 'Vorschau' : 'Rückblick';
    var facts;
    if (!s.planned) {
      facts = s.beforeStart ? '<strong>Vor deinem Start</strong><span class="muted small">Zählt nur, was du nachträglich abhakst</span>' : '<strong>Keine Einheiten geplant</strong><span class="muted small">Trainingsfreie Woche</span>';
    } else if (future) {
      facts = '<strong>' + s.planned + ' ' + plural(s.planned, 'Einheit', 'Einheiten') + ' geplant</strong><span class="muted small">Abhaken kannst du jederzeit</span>';
    } else if (!s.counted) {
      facts = '<strong>' + (s.open ? s.open + ' noch offen' : 'Noch nichts fällig') + '</strong><span class="muted small">' + (s.excused ? s.excused + ' entschuldigt · ' : '') + 'Hak ab, was du trainiert hast</span>';
    } else {
      var bits = [];
      if (s.excused) bits.push(s.excused + ' entschuldigt');
      if (s.missedMarked + s.unmarked) bits.push((s.missedMarked + s.unmarked) + ' ausgelassen');
      if (s.open) bits.push(s.open + ' noch offen');
      facts = '<strong>' + s.done + ' von ' + s.counted + ' erledigt</strong>' + (bits.length ? '<span class="muted small">' + bits.join(' · ') + '</span>' : '');
    }
    return '<section class="card summary" aria-label="Wochenbilanz">' +
      '<div class="eyebrow">' + eyebrow + '</div>' +
      '<div class="summary-main"><div class="hero-num">' + pct(s.quota) + '</div><div class="summary-facts">' + facts + '</div></div>' +
      '<div class="meter" role="img" aria-label="Quote ' + pct(s.quota) + '"><span style="width:' + (s.quota == null ? 0 : Math.round(s.quota * 100)) + '%"></span></div>' +
      '<div class="actions"><button type="button" class="btn" data-action="share-week">' + icon('share') + 'Wochenbilanz teilen</button></div>' +
    '</section>';
  }

  function weightCard(today) {
    var last = latestWeight();
    var todayVal = state.weights[today];
    return '<section class="card weight-card">' +
      '<div class="weight-row"><h2 class="h2">Gewicht</h2><span class="muted small">' +
        (last ? 'zuletzt ' + nf1.format(last.kg) + ' kg am ' + fmtDate(last.date) : 'noch kein Eintrag') + '</span></div>' +
      '<form class="weight-form" id="weightForm" novalidate>' +
        '<label for="weightInput" class="vh">Gewicht heute in Kilogramm</label>' +
        '<input id="weightInput" type="text" inputmode="decimal" autocomplete="off" placeholder="z. B. 82,4" value="' + (todayVal != null ? esc(nf1.format(todayVal)) : '') + '">' +
        '<span class="unit">kg</span>' +
        '<button type="submit" class="btn">' + (todayVal != null ? 'Ändern' : 'Speichern') + '</button>' +
      '</form></section>';
  }

  function dayCard(date, today) {
    var items = itemsFor(date);
    var wd = weekday(date);
    var isToday = date === today;
    var doneN = items.filter(function (it) { return it.st && it.st.s === 'done'; }).length;
    return '<article class="day' + (isToday ? ' is-today' : '') + '">' +
      '<header class="day-head"><div class="day-title"><span class="day-name">' + WD_LONG[wd - 1] + '</span><span class="day-date">' + fmtDate(date) + '</span>' +
        (isToday ? '<span class="chip today">Heute</span>' : '') + '</div>' +
        (items.length ? '<span class="day-count" aria-label="' + doneN + ' von ' + items.length + ' erledigt">' + doneN + '/' + items.length + '</span>' : '') + '</header>' +
      (items.length ? '<ul class="items">' + items.map(function (it) { return itemRow(date, it); }).join('') + '</ul>' : '<p class="rest">Trainingsfrei</p>') +
      '<div class="day-foot"><button type="button" class="btn small ghost" data-action="add-extra" data-date="' + date + '">' + icon('plus') + 'Übung</button></div>' +
    '</article>';
  }

  function itemRow(date, it) {
    var ex = it.ex;
    var st = it.st;
    var name = ex ? ex.name : (st && st.n) || 'Gelöschte Übung';
    var cat = ex ? ex.cat : (st && st.c);
    var meta = ex ? [ex.dose, kindLabel(ex)].filter(Boolean).join(' · ') : '';
    var s = st ? st.s : null;
    var exc = isExcused(st);
    var chips = '';
    if (s === 'missed') chips += '<span class="chip ' + (exc ? 'excused' : 'missed') + '">' + (st.r && REASONS[st.r] ? REASONS[st.r].label : 'Nicht gemacht') + (exc ? ' · zählt nicht' : '') + '</span>';
    if (it.orphan) chips += '<span class="chip">nicht mehr im Plan</span>';
    else if (it.extra) chips += '<span class="chip">zusätzlich</span><button type="button" class="link-btn" data-action="remove-extra" data-date="' + date + '" data-id="' + esc(it.id) + '">entfernen</button>';
    return '<li class="item' + (s ? ' is-' + s : '') + '">' +
      '<div class="item-main"><span class="item-cat">' + esc(catLabel(cat)) + '</span><span class="item-name">' + esc(name) + '</span>' +
        (meta ? '<span class="item-meta">' + esc(meta) + '</span>' : '') +
        (chips ? '<span class="item-chips">' + chips + '</span>' : '') + '</div>' +
      '<div class="item-actions">' +
        '<button type="button" class="mark done" data-action="mark-done" data-date="' + date + '" data-id="' + esc(it.id) + '" aria-pressed="' + (s === 'done') + '" aria-label="' + esc(name) + ' erledigt">' + icon('check') + '</button>' +
        '<button type="button" class="mark miss' + (exc ? ' excused' : '') + '" data-action="mark-miss" data-date="' + date + '" data-id="' + esc(it.id) + '" aria-pressed="' + (s === 'missed') + '" aria-label="' + esc(name) + ' nicht gemacht">' + icon('cross') + '</button>' +
      '</div></li>';
  }

  function saveWeight() {
    var input = $('#weightInput');
    if (!input) return;
    var kg = parseNum(input.value);
    if (kg == null || kg < 25 || kg > 300) { toast('Bitte das Gewicht in kg eingeben, z. B. 82,4'); input.focus(); return; }
    state.weights[todayISO()] = Math.round(kg * 10) / 10;
    save();
    askPersistOnce();
    renderView();
    toast('Gewicht gespeichert');
  }

  function summaryText(monday) {
    var s = weekStats(monday);
    var sunday = addDays(monday, 6);
    var today = todayISO();
    var p = phaseFor(monday <= today && today <= sunday ? today : monday) || phaseFor(sunday);
    var lines = [];
    var who = state.profile.name ? ' von ' + state.profile.name : '';
    lines.push('Wochenbilanz' + who + ' · KW ' + isoWeek(monday) + ' (' + fmtDate(monday) + '–' + fmtDateY(sunday) + ')');
    if (p) lines.push('Phase: ' + p.name + ', Woche ' + phaseWeekNo(p, p.start > monday ? p.start : (monday <= today && today <= sunday ? today : monday)) + ' von ' + phaseWeeks(p));
    if (!s.planned) lines.push('Keine Einheiten geplant.');
    else {
      lines.push('Erledigt: ' + s.done + ' von ' + s.counted + (s.quota != null ? ' (' + pct(s.quota).replace(' ', ' ') + ')' : ''));
      var rs = Object.keys(s.reasons).filter(function (k) { return REASONS[k] && REASONS[k].excused; })
        .map(function (k) { return s.reasons[k] + ' × ' + REASONS[k].label.toLowerCase(); });
      if (rs.length) lines.push('Entschuldigt: ' + rs.join(', '));
      if (s.missedNames.length) lines.push('Ausgelassen: ' + s.missedNames.join(', '));
      if (s.unmarked) lines.push('Nicht abgehakt: ' + s.unmarked);
      if (s.open) lines.push('Noch geplant: ' + s.open);
    }
    state.goals.filter(function (g) { return g.status === 'offen' && g.technik; }).forEach(function (g) {
      var ss = g.sessions.filter(function (x) { return x.date >= monday && x.date <= sunday; });
      if (!ss.length) return;
      var A = 0, H = 0;
      ss.forEach(function (x) { A += x.a; H += x.h; });
      lines.push('Technik: ' + g.title + ' ' + pct(H / A).replace('\u00a0', ' ') + ' (' + H + '/' + A + ' in ' + ss.length + ' ' + plural(ss.length, 'Sparring', 'Sparrings') + '), Ziel ab ' + g.technik.target + ' %');
    });
    var nt = nextTournament();
    if (nt) lines.push('Nächstes Turnier: ' + nt.name + ' ' + inDays(diffDays(today, nt.date)) + ' (' + fmtDateY(nt.date) + ')');
    if (state.settings.shareWeight) {
      var lw = null;
      Object.keys(state.weights).sort().forEach(function (d) { if (d <= sunday) lw = { date: d, kg: state.weights[d] }; });
      if (lw) lines.push('Gewicht: ' + nf1.format(lw.kg) + ' kg (' + fmtDate(lw.date) + ')');
    }
    return lines.join('\n');
  }

  /* =========================================================
     Plan
     ========================================================= */
  var PLAN_TABS = [['phasen', 'Phasen'], ['uebungen', 'Übungen'], ['turniere', 'Turniere']];
  function viewPlan() {
    var html = '<section class="page-head"><h1 class="page-title">Plan</h1><p class="sub">Saison, Wochenvorlagen, Übungen und Turniere</p></section>' +
      '<div class="seg-ctl" role="group" aria-label="Bereich im Plan">' + PLAN_TABS.map(function (t) {
        return '<button type="button" data-action="plan-tab" data-k="' + t[0] + '" aria-pressed="' + (ui.planTab === t[0]) + '">' + t[1] + '</button>';
      }).join('') + '</div>';
    if (ui.planTab === 'uebungen') html += planUebungen();
    else if (ui.planTab === 'turniere') html += planTurniere();
    else html += planPhasen();
    return html;
  }

  function seasonBar() {
    var ps = state.phases.slice().sort(function (a, b) { return a.start < b.start ? -1 : 1; });
    if (!ps.length) return '';
    var from = ps[0].start, to = ps[0].end;
    ps.forEach(function (p) { if (p.end > to) to = p.end; });
    var total = diffDays(from, to) + 1;
    var today = todayISO();
    var segs = ps.map(function (p) {
      var left = diffDays(from, p.start) / total * 100;
      var width = (diffDays(p.start, p.end) + 1) / total * 100;
      var label = width * 3.2 > 44 ? PHASE_TYPES[p.type].mini : '';
      return '<div class="season-seg ph-' + p.type + '" style="left:' + left.toFixed(3) + '%;width:' + width.toFixed(3) + '%" title="' + esc(p.name + ': ' + fmtDate(p.start) + '–' + fmtDateY(p.end)) + '">' + label + '</div>';
    }).join('');
    var now = today >= from && today <= to ? '<div class="season-now" style="left:' + ((diffDays(from, today) + 0.5) / total * 100).toFixed(3) + '%" title="Heute"></div>' : '';
    var ts = state.tournaments.filter(function (t) { return t.date && t.date >= from && t.date <= to; }).map(function (t) {
      return '<div class="season-t" style="left:' + ((diffDays(from, t.date) + 0.5) / total * 100).toFixed(3) + '%" title="' + esc(t.name + ', ' + fmtDateY(t.date)) + '"></div>';
    }).join('');
    var types = {};
    ps.forEach(function (p) { types[p.type] = 1; });
    var legend = ['allg', 'spez', 'wk', 'pause'].filter(function (k) { return types[k]; }).map(function (k) {
      return '<span><i class="sw ph-' + k + '"></i>' + PHASE_TYPES[k].label + '</span>';
    }).join('') + (now ? '<span><i class="sw now"></i>Heute</span>' : '') + (ts ? '<span><i class="sw t"></i>Turnier</span>' : '');
    return '<section class="card season" aria-label="Saisonübersicht"><div class="eyebrow">Saison</div>' +
      '<div class="season-track" role="img" aria-label="Saison vom ' + fmtDateY(from) + ' bis ' + fmtDateY(to) + '"><div class="season-bar">' + segs + '</div>' + ts + now + '</div>' +
      '<div class="season-axis"><span>' + fmtDateY(from) + '</span><span>' + fmtDateY(to) + '</span></div>' +
      '<div class="season-legend">' + legend + '</div></section>';
  }

  function planPhasen() {
    var today = todayISO();
    var ps = state.phases.slice().sort(function (a, b) { return a.start < b.start ? -1 : 1; });
    var active = phaseFor(today);
    var html = seasonBar();
    html += '<div class="actions"><button type="button" class="btn primary" data-action="new-phase">' + icon('plus') + 'Neue Phase</button>' +
      (!ps.length ? '<button type="button" class="btn" data-action="load-example">Beispielplan laden</button>' : '') + '</div>';
    if (!ps.length) return html + '<p class="empty">Noch keine Phasen. Eine Phase hat Beginn, Ende und eine Wochenvorlage, die sich jede Woche wiederholt.</p>';
    html += '<div class="list">' + ps.map(function (p) {
      var status, live = false;
      if (active && active.id === p.id) { status = 'läuft · Woche ' + phaseWeekNo(p, today) + ' von ' + phaseWeeks(p); live = true; }
      else if (p.start > today) status = 'ab ' + fmtDate(p.start) + ' (' + inDays(diffDays(today, p.start)) + ')';
      else if (p.end < today) status = 'beendet';
      else status = 'überdeckt';
      var perWeek = 0;
      for (var d = 1; d <= 7; d++) perWeek += (p.days[d] || []).length;
      var warn = openWarnings(p);
      return '<button type="button" class="list-card" data-action="edit-phase" data-id="' + p.id + '">' +
        '<span class="lc-top">' + phaseChip(p) + '<span class="lc-status' + (live ? ' live' : '') + '">' + status + '</span></span>' +
        '<span class="lc-title">' + esc(p.name) + '</span>' +
        '<span class="lc-meta">' + fmtDate(p.start) + '–' + fmtDateY(p.end) + ' · ' + phaseWeeks(p) + ' ' + plural(phaseWeeks(p), 'Woche', 'Wochen') + ' · ' + perWeek + ' ' + plural(perWeek, 'Einheit', 'Einheiten') + ' pro Woche</span>' +
        (warn ? '<span><span class="chip warn">' + icon('alert') + warn + ' ' + plural(warn, 'Hinweis', 'Hinweise') + ' im Regel-Check</span></span>' : '') +
      '</button>';
    }).join('') + '</div>';
    return html;
  }

  function planUebungen() {
    var html = '<div class="actions"><button type="button" class="btn primary" data-action="new-exercise">' + icon('plus') + 'Neue Übung</button></div>';
    if (!state.exercises.length) return html + '<p class="empty">Noch keine Übungen. Lege deine eigenen Übungen an, z. B. „Krumphau aus dem Vom Tag“ oder „Sprintintervalle“.</p>';
    CAT_ORDER.forEach(function (cat) {
      var list = state.exercises.filter(function (e) { return e.cat === cat; }).sort(byName);
      if (!list.length) return;
      html += '<section class="lib-group"><h2 class="eyebrow">' + esc(CATS[cat].label) + ' · ' + list.length + '</h2><ul class="lib-list">' + list.map(function (e) {
        var used = exUsage(e.id);
        var meta = [e.dose, kindLabel(e), used ? 'in ' + used + ' ' + plural(used, 'Phase', 'Phasen') : 'in keiner Phase'].filter(Boolean).join(' · ');
        return '<li><button type="button" class="lib-item" data-action="edit-exercise" data-id="' + e.id + '"><span class="lib-name">' + esc(e.name) + '</span><span class="lib-meta">' + esc(meta) + '</span></button></li>';
      }).join('') + '</ul></section>';
    });
    return html;
  }

  function tournamentSummary(t) {
    var r = t.result || {};
    var bits = [];
    if (r.placement != null) bits.push('Platz ' + r.placement + (r.participants != null ? ' von ' + r.participants : ''));
    if (r.wins != null || r.losses != null) bits.push((r.wins || 0) + ' S · ' + (r.losses || 0) + ' N');
    var ts = tStats(t);
    if (ts.bilPerFight != null) bits.push(nfMax1.format(ts.bilPerFight) + ' Doppel/Kampf');
    return bits.join(' · ');
  }

  function planTurniere() {
    var today = todayISO();
    var html = '<div class="actions"><button type="button" class="btn primary" data-action="new-tournament">' + icon('plus') + 'Turnier eintragen</button></div>';
    if (!state.tournaments.length) return html + '<p class="empty">Noch keine Turniere. Trag deine Turniertermine ein, nach dem Turnier kommen Platzierung, Treffer und Doppeltreffer dazu.</p>';
    var upcoming = state.tournaments.filter(function (t) { return t.date >= today; }).sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    var past = state.tournaments.filter(function (t) { return !(t.date >= today); }).sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    function card(t, isNext) {
      var sum = tournamentSummary(t);
      var status = t.date >= today ? inDays(diffDays(today, t.date)) : (hasResult(t) ? 'Ergebnis eingetragen' : 'Ergebnis fehlt');
      return '<button type="button" class="list-card" data-action="edit-tournament" data-id="' + t.id + '">' +
        '<span class="lc-top"><span class="chip' + (isNext ? ' today' : '') + '">' + icon('trophy') + (t.date ? fmtDateY(t.date) : 'ohne Datum') + '</span><span class="lc-status' + (isNext ? ' live' : '') + '">' + status + '</span></span>' +
        '<span class="lc-title">' + esc(t.name) + '</span>' +
        ((t.place || t.weapon) ? '<span class="lc-meta">' + esc([t.weapon, t.place].filter(Boolean).join(' · ')) + '</span>' : '') +
        (sum ? '<span class="lc-meta">' + esc(sum) + '</span>' : '') +
      '</button>';
    }
    if (upcoming.length) html += '<h2 class="eyebrow">Anstehend</h2><div class="list">' + upcoming.map(function (t, i) { return card(t, i === 0); }).join('') + '</div>';
    if (past.length) html += '<h2 class="eyebrow">Vergangen</h2><div class="list">' + past.map(function (t) { return card(t, false); }).join('') + '</div>';
    return html;
  }

  /* =========================================================
     Diagnostik
     ========================================================= */
  function assessmentsSorted() {
    return state.diag.assessments.slice().sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : (a.id < b.id ? 1 : -1); });
  }
  function diagItem(id) { for (var i = 0; i < state.diag.items.length; i++) if (state.diag.items[i].id === id) return state.diag.items[i]; return null; }
  function rated(a) {
    return state.diag.items.filter(function (i) { return Array.isArray(a.r[i.id]); }).map(function (i) {
      var v = a.r[i.id];
      return { item: i, ist: v[0], soll: v[1], gap: v[1] - v[0] };
    });
  }
  function areaValues(a) {
    var rs = rated(a);
    return AREAS.map(function (ar) {
      var xs = rs.filter(function (x) { return x.item.area === ar[0]; });
      if (!xs.length) return null;
      var si = 0, ss = 0;
      xs.forEach(function (x) { si += x.ist; ss += x.soll; });
      return { ist: si / xs.length, soll: ss / xs.length };
    });
  }
  function baustellen(a, n) {
    return rated(a).filter(function (x) { return x.gap > 0; }).sort(function (x, y) { return y.gap - x.gap || x.ist - y.ist; }).slice(0, n);
  }
  function staerken(a, n) {
    return rated(a).sort(function (x, y) { return y.ist - x.ist || x.gap - y.gap; }).slice(0, n);
  }
  function openGoalForItem(itemId) {
    for (var i = 0; i < state.goals.length; i++) if (state.goals[i].diag === itemId && state.goals[i].status === 'offen') return state.goals[i];
    return null;
  }
  var nf1d = function (x) { return nf1.format(x); };
  function testDisplay(t, v) {
    if (v == null || v === '') return '–';
    if (t.kind === 'choice') return t.options && t.options[v] ? t.options[v].short : '–';
    return nfMax1.format(v) + (t.unit ? ' ' + t.unit : '');
  }

  function viewDiagnostik() {
    var list = assessmentsSorted();
    var html = '<section class="page-head"><h1 class="page-title">Diagnostik</h1><p class="sub">Stärken und Baustellen erkennen</p></section>';
    if (!list.length) {
      return html + '<section class="card"><div class="eyebrow">So funktioniert es</div><h2 class="h2">Dein Leistungsprofil</h2>' +
        '<p class="muted">Du bewertest ' + state.diag.items.length + ' Qualitäten von 1 bis 10: wo du jetzt stehst und wo du für deine Turnierziele hinwillst. Die größten Lücken sind deine Baustellen. Daraus machst du Ziele. Die Methode heißt Performance Profiling und stammt aus der Sportpsychologie.</p>' +
        '<ol class="steps"><li>Fragebogen ausfüllen, dauert etwa 10 Minuten</li><li>Optional die ' + state.diag.tests.length + ' Tests messen</li><li>Baustellen in Ziele verwandeln</li><li>Alle 4 bis 6 Wochen wiederholen und vergleichen</li></ol>' +
        '<div class="actions"><button type="button" class="btn primary" data-action="diag-start">Diagnostik starten</button><button type="button" class="btn" data-action="diag-config">Fragen anpassen</button></div></section>';
    }
    var a = list[0], prev = list[1] || null;
    var cur = areaValues(a), pv = prev ? areaValues(prev) : null;
    html += '<div class="actions"><button type="button" class="btn primary" data-action="diag-start">' + icon('plus') + 'Neue Diagnostik</button><button type="button" class="btn" data-action="diag-config">Fragen anpassen</button></div>';

    // Überblick
    html += '<section class="card chart-card"><div class="chart-head"><h2 class="h2">Überblick</h2><span class="hint">Stand ' + fmtDateY(a.date) + '</span></div>' +
      '<div class="legend"><span><i class="key-line"></i>Jetzt</span><span><i class="key-line k2"></i>Ziel</span>' + (prev ? '<span><i class="key-line k3"></i>Vorher (' + fmtDate(prev.date) + ')</span>' : '') + '</div>' +
      '<div class="chart radar" id="radar"></div>' +
      '<div class="area-cells">' + AREAS.map(function (ar, i) {
        var c = cur[i];
        if (!c) return '<div class="area-cell"><span class="label">' + ar[1] + '</span><span class="value">–</span></div>';
        var d = pv && pv[i] ? c.ist - pv[i].ist : null;
        return '<div class="area-cell"><span class="label">' + ar[1] + '</span><span class="value">' + nf1d(c.ist) + '</span><span class="detail">Ziel ' + nf1d(c.soll) +
          (d != null && Math.abs(d) >= 0.05 ? '<br>' + (d > 0 ? '+' : '−') + nf1d(Math.abs(d)) + ' seit ' + fmtDate(prev.date) : '') + '</span></div>';
      }).join('') + '</div></section>';

    // Baustellen und Stärken
    var bs = baustellen(a, 3);
    html += '<section class="card"><div class="chart-head"><h2 class="h2">Baustellen</h2><span class="hint">größte Lücken</span></div>';
    if (!bs.length) html += '<p class="empty">Keine Lücken: Überall stehst du schon auf deinem Zielwert.</p>';
    else html += '<ul class="rank-list">' + bs.map(function (x) {
      var g = openGoalForItem(x.item.id);
      return '<li><div><span class="rank-name">' + esc(x.item.name) + '</span><span class="rank-meta">' + AREA_LABEL[x.item.area] + ' · jetzt ' + x.ist + ', Ziel ' + x.soll + ' · Lücke ' + x.gap + '</span></div>' +
        (g ? '<button type="button" class="btn small" data-action="edit-goal" data-id="' + g.id + '">' + icon('check') + 'Ziel läuft</button>' : '<button type="button" class="btn small primary" data-action="goal-from-diag" data-item="' + esc(x.item.id) + '">Ziel daraus machen</button>') + '</li>';
    }).join('') + '</ul>';
    html += '</section>';
    var st = staerken(a, 3);
    html += '<section class="card"><div class="chart-head"><h2 class="h2">Stärken</h2><span class="hint">höchste Werte</span></div><ul class="rank-list">' + st.map(function (x) {
      return '<li><div><span class="rank-name">' + esc(x.item.name) + '</span><span class="rank-meta">' + AREA_LABEL[x.item.area] + ' · jetzt ' + x.ist + (x.gap > 0 ? ', Ziel ' + x.soll : ', Ziel erreicht') + '</span></div></li>';
    }).join('') + '</ul></section>';

    // Profil
    html += '<section class="card"><div class="chart-head"><h2 class="h2">Profil</h2></div>' +
      '<div class="legend"><span><i class="key-dot k1"></i>Jetzt</span><span><i class="key-tick"></i>Ziel</span>' + (prev ? '<span><i class="key-ring"></i>Vorher</span>' : '') + '<span><i class="key-gap"></i>Lücke</span></div>';
    AREAS.forEach(function (ar) {
      var rows = rated(a).filter(function (x) { return x.item.area === ar[0]; });
      if (!rows.length) return;
      html += '<div class="prof-area"><h3 class="eyebrow">' + ar[1] + '</h3>' + rows.map(function (x) {
        var pos = function (v) { return ((v - 1) / 9 * 100).toFixed(2) + '%'; };
        var pr = prev && Array.isArray(prev.r[x.item.id]) ? prev.r[x.item.id][0] : null;
        var lo = Math.min(x.ist, x.soll), hi = Math.max(x.ist, x.soll);
        return '<div class="prof-row"><span class="prof-name">' + esc(x.item.name) + '</span><span class="prof-val">' + x.ist + ' → ' + x.soll + (pr != null && pr !== x.ist ? ' <span class="muted">(vorher ' + pr + ')</span>' : '') + '</span>' +
          '<span class="prof-track" aria-hidden="true">' +
            (hi > lo ? '<i class="prof-gap" style="left:' + pos(lo) + ';width:' + ((hi - lo) / 9 * 100).toFixed(2) + '%"></i>' : '') +
            '<i class="prof-soll" style="left:' + pos(x.soll) + '"></i>' +
            (pr != null ? '<i class="prof-prev" style="left:' + pos(pr) + '"></i>' : '') +
            '<i class="prof-ist" style="left:' + pos(x.ist) + '"></i>' +
          '</span></div>';
      }).join('') + '</div>';
    });
    html += '<div class="prof-scale" aria-hidden="true"><span>1</span><span>5</span><span>10</span></div></section>';

    // Tests
    var tests = state.diag.tests;
    var anyTest = list.some(function (x) { return Object.keys(x.t).length; });
    html += '<section class="card"><div class="chart-head"><h2 class="h2">Tests</h2></div>';
    if (!tests.length) html += '<p class="empty">Keine Tests angelegt.</p>';
    else if (!anyTest) html += '<p class="empty">Noch keine Testwerte. Trag sie bei der nächsten Diagnostik ein.</p>';
    else {
      html += '<div class="table-wrap"><table><thead><tr><th>Test</th><th class="num">Jetzt</th>' + (prev ? '<th class="num">Vorher</th><th class="num">Tendenz</th>' : '') + '</tr></thead><tbody>' +
        tests.map(function (t) {
          var v = a.t[t.id], p = prev ? prev.t[t.id] : null;
          var trend = '';
          if (prev && v != null && v !== '' && p != null && p !== '') {
            var d = Number(v) - Number(p);
            if (Math.abs(d) < 1e-9) trend = '<span class="chip">gleich</span>';
            else {
              var better = t.better === 'lower' ? d < 0 : d > 0;
              trend = '<span class="chip ' + (better ? 'ok' : 'missed') + '">' + icon(better ? 'up' : 'down') + (better ? 'besser' : 'schlechter') + '</span>';
            }
          }
          return '<tr><td class="t-name">' + esc(t.name) + (t.kind === 'number' && t.unit ? '<span>' + (t.better === 'lower' ? 'weniger ist besser' : 'mehr ist besser') + '</span>' : '') + '</td><td class="num">' + esc(testDisplay(t, v)) + '</td>' +
            (prev ? '<td class="num">' + esc(testDisplay(t, p)) + '</td><td class="num">' + trend + '</td>' : '') + '</tr>';
        }).join('') + '</tbody></table></div>';
    }
    html += '</section>';

    // Verlauf
    html += '<section class="card"><div class="chart-head"><h2 class="h2">Bisherige Diagnostiken</h2></div><ul class="rank-list">' + list.map(function (x) {
      var rs = rated(x), avg = 0;
      rs.forEach(function (r) { avg += r.ist; });
      avg = rs.length ? avg / rs.length : null;
      return '<li><div><span class="rank-name">' + fmtDateY(x.date) + '</span><span class="rank-meta">' + rs.length + ' Qualitäten · Ø jetzt ' + (avg != null ? nf1d(avg) : '–') + (x.note ? ' · ' + esc(x.note) : '') + '</span></div><button type="button" class="btn small" data-action="diag-edit" data-id="' + x.id + '">Bearbeiten</button></li>';
    }).join('') + '</ul>' +
      '<p class="hint">Wiederhole die Diagnostik alle 4 bis 6 Wochen, am besten am Ende einer Phase.</p></section>';
    return html;
  }

  function drawRadar(el) {
    var list = assessmentsSorted();
    if (!list.length) return;
    var a = list[0], prev = list[1] || null;
    var cur = areaValues(a), pv = prev ? areaValues(prev) : null;
    var W = Math.min(380, Math.max(260, Math.floor(el.clientWidth || 320)));
    var H = Math.round(W * 0.78);
    var cx = W / 2, cy = H / 2;
    var R = Math.min(W / 2 - 66, H / 2 - 24);
    var ang = [-90, 0, 90, 180].map(function (d) { return d * Math.PI / 180; });
    function pt(i, v) { var r = R * Math.max(0, v) / 10; return [cx + r * Math.cos(ang[i]), cy + r * Math.sin(ang[i])]; }
    function poly(vals) { return vals.map(function (v, i) { var p = pt(i, v == null ? 0 : v); return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' '); }
    var parts = [];
    [2, 4, 6, 8, 10].forEach(function (v) { parts.push('<polygon class="gridline ring" points="' + poly([v, v, v, v]) + '"/>'); });
    for (var i = 0; i < 4; i++) { var e = pt(i, 10); parts.push('<line class="gridline" x1="' + cx + '" y1="' + cy + '" x2="' + e[0].toFixed(1) + '" y2="' + e[1].toFixed(1) + '"/>'); }
    var t10 = pt(0, 10), t5 = pt(0, 5);
    parts.push('<text x="' + (t10[0] + 6) + '" y="' + (t10[1] + 10) + '">10</text><text x="' + (t5[0] + 6) + '" y="' + (t5[1] + 4) + '">5</text>');
    parts.push('<polygon class="r-soll" points="' + poly(cur.map(function (c) { return c ? c.soll : null; })) + '"/>');
    if (pv) parts.push('<polygon class="r-prev" points="' + poly(pv.map(function (c) { return c ? c.ist : null; })) + '"/>');
    parts.push('<polygon class="r-ist" points="' + poly(cur.map(function (c) { return c ? c.ist : null; })) + '"/>');
    cur.forEach(function (c, i) { if (!c) return; var p = pt(i, c.ist); parts.push('<circle class="dot-ist" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="4"/>'); });
    var lp = [[cx, cy - R - 10, 'middle'], [cx + R + 10, cy + 4, 'start'], [cx, cy + R + 20, 'middle'], [cx - R - 10, cy + 4, 'end']];
    AREAS.forEach(function (ar, i) { parts.push('<text class="radar-label" x="' + lp[i][0].toFixed(1) + '" y="' + lp[i][1].toFixed(1) + '" text-anchor="' + lp[i][2] + '">' + ar[1] + '</text>'); });
    var desc = AREAS.map(function (ar, i) { return ar[1] + ' ' + (cur[i] ? nf1d(cur[i].ist) + ' von Ziel ' + nf1d(cur[i].soll) : 'ohne Wert'); }).join(', ');
    el.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="Netzdiagramm der Bereiche: ' + esc(desc) + '">' + parts.join('') + '</svg>';
  }

  /* =========================================================
     Ziele
     ========================================================= */
  function goalById(id) { for (var i = 0; i < state.goals.length; i++) if (state.goals[i].id === id) return state.goals[i]; return null; }
  function sortedSessions(g) { return g.sessions.slice().sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; }); }
  function zoneOf(q) { if (q == null) return null; if (q < 0.3) return 'schwer'; if (q > 0.7) return 'leicht'; return 'lern'; }
  function techStats(g) {
    var ss = sortedSessions(g), last = ss[ss.length - 1] || null, t = g.technik, run = 0;
    if (t) {
      var valid = ss.filter(function (s) { return s.a >= t.min; });
      for (var i = valid.length - 1; i >= 0; i--) { if (valid[i].h / valid[i].a >= t.target / 100 - 1e-9) run++; else break; }
    }
    var lastQ = last ? last.h / last.a : null;
    return { sessions: ss, last: last, lastQ: lastQ, run: run, met: !!t && run >= t.streak, zone: zoneOf(lastQ) };
  }
  function techCriterion(t) { return '≥ ' + t.target + ' % in ' + t.streak + ' ' + plural(t.streak, 'Sparring', 'Sparrings') + ' in Folge (mind. ' + t.min + ' Versuche)'; }
  function techLine(g, ts) {
    if (!ts.last) return 'Noch kein Sparring eingetragen · Ziel ' + techCriterion(g.technik);
    return 'Zuletzt ' + pct(ts.lastQ) + ' (' + ts.last.h + '/' + ts.last.a + ') · ' + Math.min(ts.run, g.technik.streak) + ' von ' + g.technik.streak + ' in Folge ≥ ' + g.technik.target + ' %';
  }
  function plannedInfo(exId) {
    if (!exId) return '';
    var bits = [];
    state.phases.slice().sort(function (a, b) { return a.start < b.start ? -1 : 1; }).forEach(function (p) {
      var ds = [];
      for (var d = 1; d <= 7; d++) if ((p.days[d] || []).indexOf(exId) >= 0) ds.push(WD[d - 1]);
      if (ds.length) bits.push(p.name + ': ' + ds.join(', '));
    });
    return bits.join(' · ');
  }
  function reviewDueGoals() {
    var t = todayISO();
    return state.goals.filter(function (g) { return g.status === 'offen' && ((g.review && g.review <= t) || (g.deadline && g.deadline < t)); });
  }

  function goalCard(g) {
    var today = todayISO();
    var top = '<span class="lc-top"><span class="chip lv-' + g.level + '">' + GOAL_LEVELS[g.level].label + '</span>';
    if (g.status === 'erreicht') top += '<span class="chip ok">' + icon('check') + 'erreicht' + (g.closedAt ? ' ' + fmtDate(g.closedAt) : '') + '</span>';
    else if (g.status === 'nicht') top += '<span class="chip missed">nicht erreicht</span>';
    else if (g.deadline) top += g.deadline < today ? '<span class="lc-status warn-text">Frist abgelaufen</span>' : '<span class="lc-status">bis ' + fmtDateY(g.deadline) + ' · ' + inDays(diffDays(today, g.deadline)) + '</span>';
    top += '</span>';
    var parent = g.parent ? goalById(g.parent) : null;
    var ts = g.technik ? techStats(g) : null;
    var lines = '';
    if (g.measure) lines += '<span class="lc-meta">' + esc(g.measure) + '</span>';
    if (parent) lines += '<span class="lc-meta">zahlt ein auf: ' + esc(parent.title) + '</span>';
    if (ts) {
      lines += '<span class="mini chart" data-goal="' + g.id + '" aria-hidden="true"></span>';
      lines += '<span class="lc-meta">' + esc(techLine(g, ts)) + '</span>';
      if (ts.zone && g.status === 'offen') lines += '<span class="item-chips"><span class="chip ' + ZONES[ts.zone].cls + '">' + ZONES[ts.zone].label + '</span></span>';
    }
    if (g.measures.length) {
      var planned = g.measures.filter(function (m) { return m.exId && plannedInfo(m.exId); }).length;
      lines += '<span class="lc-meta">' + g.measures.length + ' ' + plural(g.measures.length, 'Maßnahme', 'Maßnahmen') + (planned ? ', ' + planned + ' eingeplant' : '') + '</span>';
    }
    if (ts && ts.met && g.status === 'offen') lines += '<span class="item-chips"><span class="chip ok">' + icon('check') + 'Kriterium erfüllt. Als erreicht markieren?</span></span>';
    var actions = '';
    if (g.status === 'offen' && g.technik) actions += '<button type="button" class="btn small" data-action="add-session" data-id="' + g.id + '">' + icon('plus') + 'Sparring eintragen</button>';
    if (g.status === 'offen' && ts && ts.met) actions += '<button type="button" class="btn small primary" data-action="goal-done" data-id="' + g.id + '" data-k="erreicht">Als erreicht markieren</button>';
    return '<div class="goal-card"><button type="button" class="goal-main" data-action="edit-goal" data-id="' + g.id + '">' + top + '<span class="lc-title">' + esc(g.title) + '</span>' + lines + '</button>' +
      (actions ? '<div class="goal-actions">' + actions + '</div>' : '') + '</div>';
  }

  function viewZiele() {
    var today = todayISO();
    var html = '<section class="page-head"><h1 class="page-title">Ziele</h1><p class="sub">Vom Traumziel bis zur nächsten Einheit</p></section>' +
      '<div class="actions"><button type="button" class="btn primary" data-action="goal-new">' + icon('plus') + 'Neues Ziel</button></div>';
    var open = state.goals.filter(function (g) { return g.status === 'offen'; });
    var closed = state.goals.filter(function (g) { return g.status !== 'offen'; }).sort(function (a, b) { return (a.closedAt || '') < (b.closedAt || '') ? 1 : -1; });

    var due = reviewDueGoals();
    if (due.length) {
      html += '<section class="card"><div class="eyebrow">Rückschau</div><h2 class="h2">Passt das noch zu dir?</h2>' +
        '<p class="muted">Prüf regelmäßig, ob deine Ziele noch zu dem passen, was dir wichtig ist. Wenn nicht, formulier sie neu.</p><ul class="rank-list">' +
        due.map(function (g) {
          var late = g.deadline && g.deadline < today;
          return '<li><div><span class="rank-name">' + esc(g.title) + '</span><span class="rank-meta">' + (late ? 'Frist am ' + fmtDateY(g.deadline) + ' abgelaufen' : 'Rückschau seit ' + fmtDateY(g.review) + ' fällig') + (g.need ? ' · Bedürfnis: ' + NEEDS[g.need] : '') + '</span></div>' +
            '<div class="actions">' + (late ? '' : '<button type="button" class="btn small" data-action="review-ok" data-id="' + g.id + '">Passt noch</button>') +
            '<button type="button" class="btn small" data-action="goal-done" data-id="' + g.id + '" data-k="erreicht">Erreicht</button>' +
            (late ? '<button type="button" class="btn small" data-action="goal-done" data-id="' + g.id + '" data-k="nicht">Nicht erreicht</button>' : '') +
            '<button type="button" class="btn small ghost" data-action="edit-goal" data-id="' + g.id + '">Anpassen</button></div></li>';
        }).join('') + '</ul></section>';
    }

    var last = assessmentsSorted()[0];
    if (last) {
      var sug = baustellen(last, 3).filter(function (x) { return !openGoalForItem(x.item.id); });
      if (sug.length) html += '<section class="card"><div class="eyebrow">Aus deiner Diagnostik</div><ul class="rank-list">' + sug.map(function (x) {
        return '<li><div><span class="rank-name">' + esc(x.item.name) + '</span><span class="rank-meta">jetzt ' + x.ist + ', Ziel ' + x.soll + '</span></div><button type="button" class="btn small primary" data-action="goal-from-diag" data-item="' + esc(x.item.id) + '">Ziel daraus machen</button></li>';
      }).join('') + '</ul></section>';
    }

    if (!state.goals.length) {
      html += '<section class="card"><div class="eyebrow">So baust du Ziele auf</div><h2 class="h2">Vom Traum zur Einheit</h2>' +
        '<ul class="soon-list"><li><strong>Traumziel:</strong> deine Vision als Fechter.</li><li><strong>Leistungsziel:</strong> ein messbares Ergebnis, etwa eine Platzierung.</li><li><strong>Prozessziel:</strong> was du selbst in der Hand hast, etwa eine Technik im Sparring.</li></ul>' +
        '<p class="muted">Jedes Ziel ist SMART: konkret, messbar, erstrebenswert, realistisch und mit Termin. Kurzfristige Ziele zahlen auf langfristige ein.</p>' +
        '<div class="actions"><button type="button" class="btn primary" data-action="goal-new">Erstes Ziel anlegen</button>' + (!last ? '<button type="button" class="btn" data-action="tab" data-tab="diagnostik">Erst Diagnostik machen</button>' : '') + '</div></section>';
      return html;
    }

    LEVEL_ORDER.forEach(function (lv) {
      var gs = open.filter(function (g) { return g.level === lv; });
      if (!gs.length) return;
      html += '<h2 class="eyebrow">' + GOAL_LEVELS[lv].plural + '</h2><div class="list">' + gs.map(goalCard).join('') + '</div>';
    });
    if (!open.length) html += '<p class="empty">Keine offenen Ziele. Leg ein neues an.</p>';
    if (closed.length) {
      html += '<details class="tbl"><summary>Abgeschlossen (' + closed.length + ')</summary><div class="list">' + closed.map(goalCard).join('') + '</div></details>';
    }
    return html;
  }

  function drawMini(el) {
    var g = goalById(el.dataset.goal);
    if (!g || !g.technik) return;
    var ss = sortedSessions(g).slice(-12);
    var W = Math.max(220, Math.floor(el.clientWidth || 280)), H = 92;
    var m = { l: 4, r: 46, t: 10, b: 8 };
    var pw = W - m.l - m.r, ph = H - m.t - m.b;
    function y(q) { return m.t + ph * (1 - q); }
    function x(i) { return ss.length === 1 ? m.l + pw / 2 : m.l + pw * i / (ss.length - 1); }
    var tq = g.technik.target / 100;
    var parts = [];
    parts.push('<rect class="zone-band" x="' + m.l + '" y="' + y(0.7) + '" width="' + pw + '" height="' + (y(0.3) - y(0.7)) + '"/>');
    parts.push('<line class="baseline" x1="' + m.l + '" x2="' + (m.l + pw) + '" y1="' + y(0) + '" y2="' + y(0) + '"/>');
    parts.push('<line class="target-line" x1="' + m.l + '" x2="' + (m.l + pw) + '" y1="' + y(tq) + '" y2="' + y(tq) + '"/>');
    if (ss.length) {
      if (ss.length > 1) parts.push('<path class="q-line" d="' + ss.map(function (s, i) { return (i ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(s.h / s.a).toFixed(1); }).join('') + '"/>');
      ss.forEach(function (s, i) { parts.push('<circle class="q-dot" cx="' + x(i).toFixed(1) + '" cy="' + y(s.h / s.a).toFixed(1) + '" r="4"/>'); });
      var lq = ss[ss.length - 1].h / ss[ss.length - 1].a;
      parts.push('<text class="strong" x="' + (x(ss.length - 1) + 9) + '" y="' + (y(lq) + 4) + '">' + pct(lq) + '</text>');
    }
    el.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" aria-hidden="true" focusable="false">' + parts.join('') + '</svg>';
  }

  function techCard() {
    var tg = state.goals.filter(function (g) { return g.status === 'offen' && g.technik; });
    if (!tg.length) return '';
    return '<section class="card"><div class="chart-head"><h2 class="h2">Technik im Sparring</h2><button type="button" class="link-btn" data-action="tab" data-tab="ziele">Alle Ziele</button></div><ul class="rank-list">' +
      tg.map(function (g) {
        var ts = techStats(g);
        return '<li><div><span class="rank-name">' + esc(g.title) + '</span><span class="rank-meta">' + (ts.last ? 'zuletzt ' + pct(ts.lastQ) + ' · ' + Math.min(ts.run, g.technik.streak) + ' von ' + g.technik.streak + ' in Folge' : 'noch kein Sparring eingetragen') + '</span>' +
          (ts.zone ? '<span class="item-chips"><span class="chip ' + ZONES[ts.zone].cls + '">' + ZONES[ts.zone].label + '</span>' + (ts.met ? '<span class="chip ok">Kriterium erfüllt</span>' : '') + '</span>' : '') + '</div>' +
          '<button type="button" class="btn small" data-action="add-session" data-id="' + g.id + '">' + icon('plus') + 'Sparring</button></li>';
      }).join('') + '</ul></section>';
  }

  /* =========================================================
     Verlauf
     ========================================================= */
  function quotaSeries() {
    var m0 = mondayOf(todayISO()), out = [];
    for (var i = 11; i >= 0; i--) {
      var mon = addDays(m0, -7 * i);
      var s = weekStats(mon);
      out.push({ mon: mon, kw: isoWeek(mon), s: s, q: s.quota, current: i === 0 });
    }
    return out;
  }
  function quotaDetail(d) {
    if (!d.s.planned && d.s.beforeStart) return 'vor deinem Start mit dem Fechtbuch';
    if (!d.s.planned) return 'kein Training geplant';
    if (d.q == null) return d.s.planned + ' geplant, noch nichts fällig';
    var t = d.s.done + ' von ' + d.s.counted + ' erledigt';
    if (d.s.excused) t += ', ' + d.s.excused + ' entschuldigt';
    if (d.current) t += ', läuft noch';
    return t;
  }
  function weightSeries() {
    var e = Object.keys(state.weights).map(function (d) { return { date: d, kg: Number(state.weights[d]) }; })
      .filter(function (x) { return isFinite(x.kg); })
      .sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    e.forEach(function (p, i) {
      var from = addDays(p.date, -6), s = 0, c = 0;
      for (var j = i; j >= 0 && e[j].date >= from; j--) { s += e[j].kg; c++; }
      p.avg = s / c;
    });
    return e;
  }

  function viewVerlauf() {
    var cur = weekStats(mondayOf(todayISO()));
    var avg = avgWeeks(12);
    var st = streak();
    var weights = weightSeries();
    var html = '<section class="page-head"><h1 class="page-title">Verlauf</h1><p class="sub">Was du geschafft hast</p></section>';
    html += '<div class="tiles">' +
      '<div class="tile"><span class="label">Diese Woche</span><span class="value">' + pct(cur.quota) + '</span><span class="detail">' + cur.done + ' von ' + cur.counted + ' erledigt</span></div>' +
      '<div class="tile"><span class="label">Ø 12 Wochen</span><span class="value">' + pct(avg.q) + '</span><span class="detail">' + avg.weeks + ' ' + plural(avg.weeks, 'Woche', 'Wochen') + ' gewertet</span></div>' +
      '<div class="tile"><span class="label">Serie ≥ 80 %</span><span class="value">' + st + '</span><span class="detail">' + plural(st, 'Woche', 'Wochen') + ' in Folge</span></div>' +
    '</div>';

    var qs = quotaSeries();
    html += '<section class="card chart-card"><div class="chart-head"><h2 class="h2">Trainingsquote</h2><span class="hint">letzte 12 Wochen</span></div>' +
      '<div class="chart" id="chartQuota"></div>' +
      '<p class="hint">Entschuldigte Einheiten (krank, verletzt, bewusst geschont) zählen nicht mit. Die laufende Woche ist heller dargestellt.</p>' +
      '<details class="tbl"><summary>Als Tabelle</summary><div class="table-wrap"><table><thead><tr><th>KW</th><th>Woche ab</th><th class="num">Erledigt</th><th class="num">Quote</th></tr></thead><tbody>' +
      qs.slice().reverse().map(function (d) {
        return '<tr><td>' + d.kw + '</td><td>' + fmtDateY(d.mon) + '</td><td class="num">' + (d.s.planned ? d.s.done + '/' + d.s.counted : '–') + '</td><td class="num">' + pct(d.q) + '</td></tr>';
      }).join('') + '</tbody></table></div></details></section>';

    html += '<section class="card chart-card"><div class="chart-head"><h2 class="h2">Gewicht</h2>' +
      (weights.length >= 2 ? '<div class="legend"><span><i class="key-dot"></i>Messwert</span><span><i class="key-line"></i>7-Tage-Schnitt</span></div>' : '') + '</div>' +
      '<div class="chart" id="chartWeight"></div>' +
      (weights.length ? '<details class="tbl"><summary>Als Tabelle</summary><div class="table-wrap"><table><thead><tr><th>Datum</th><th class="num">Gewicht</th><th class="num">7-Tage-Schnitt</th></tr></thead><tbody>' +
        weights.slice().reverse().slice(0, 60).map(function (p) {
          return '<tr><td>' + fmtDateY(p.date) + '</td><td class="num">' + nf1.format(p.kg) + ' kg</td><td class="num">' + nf1.format(p.avg) + ' kg</td></tr>';
        }).join('') + '</tbody></table></div></details>' : '') +
    '</section>';

    var done = state.tournaments.filter(hasResult).sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    html += '<section class="card"><div class="chart-head"><h2 class="h2">Turniere</h2></div>';
    if (!done.length) {
      html += '<p class="empty">Noch keine Turnierergebnisse. Trag sie unter Plan → Turniere ein.</p>';
    } else {
      var rated = done.filter(function (t) { return t.result.rating != null; });
      if (rated.length) {
        var lastR = rated[0].result.rating;
        var prevR = rated[1] ? rated[1].result.rating : null;
        html += '<p><span class="muted">HEMA-Ratings-Wert: </span><strong>' + nfMax1.format(lastR) + '</strong>' +
          (prevR != null ? ' <span class="muted">(' + (lastR - prevR >= 0 ? '+' : '−') + nfMax1.format(Math.abs(lastR - prevR)) + ' seit ' + esc(rated[1].name) + ')</span>' : '') + '</p>';
      }
      html += '<div class="table-wrap"><table class="t-table"><thead><tr><th>Turnier</th><th class="num">Platz</th><th class="num">S:N</th><th class="num">Doppel pro Kampf</th></tr></thead><tbody>' +
        done.map(function (t) {
          var r = t.result, ts = tStats(t);
          var sub = [t.date ? fmtDateY(t.date) : '', r.hitsFor != null || r.hitsAgainst != null ? 'Treffer ' + val(r.hitsFor) + ':' + val(r.hitsAgainst) : ''].filter(Boolean).join(' · ');
          return '<tr><td class="t-name">' + esc(t.name) + (sub ? '<span>' + sub + '</span>' : '') + '</td>' +
            '<td class="num">' + (r.placement != null ? r.placement + (r.participants != null ? '/' + r.participants : '') : '–') + '</td>' +
            '<td class="num">' + (ts.fights ? (r.wins || 0) + ':' + (r.losses || 0) : '–') + '</td>' +
            '<td class="num">' + (ts.bilPerFight != null ? nfMax1.format(ts.bilPerFight) : '–') + '</td></tr>';
        }).join('') + '</tbody></table></div>';
    }
    html += '</section>';

    var gd = state.goals.filter(function (g) { return g.status === 'erreicht'; });
    var gn = state.goals.filter(function (g) { return g.status === 'nicht'; });
    var go = state.goals.filter(function (g) { return g.status === 'offen'; });
    html += '<section class="card"><div class="chart-head"><h2 class="h2">Ziele</h2></div>';
    if (!state.goals.length) html += '<p class="empty">Noch keine Ziele. Leg sie unter „Ziele“ an.</p>';
    else {
      html += '<div class="stat-row"><div><span class="value">' + gd.length + '</span><span class="label">erreicht</span></div><div><span class="value">' + gn.length + '</span><span class="label">nicht erreicht</span></div><div><span class="value">' + go.length + '</span><span class="label">offen</span></div></div>';
      var cl = gd.concat(gn).sort(function (a, b) { return (a.closedAt || '') < (b.closedAt || '') ? 1 : -1; }).slice(0, 5);
      if (cl.length) html += '<ul class="rank-list">' + cl.map(function (g) {
        return '<li><div><span class="rank-name">' + esc(g.title) + '</span><span class="rank-meta">' + GOAL_LEVELS[g.level].label + (g.closedAt ? ' · ' + fmtDateY(g.closedAt) : '') + '</span></div><span class="chip ' + (g.status === 'erreicht' ? 'ok' : 'missed') + '">' + (g.status === 'erreicht' ? 'erreicht' : 'nicht erreicht') + '</span></li>';
      }).join('') + '</ul>';
    }
    html += '</section>';
    return html;
  }

  function drawCharts() {
    var q = $('#chartQuota'); if (q) drawQuotaChart(q);
    var w = $('#chartWeight'); if (w) drawWeightChart(w);
    var r = $('#radar'); if (r) drawRadar(r);
    $$('.mini[data-goal]').forEach(drawMini);
  }
  function barPath(x, yTop, w, h) {
    var r = Math.min(4, w / 2, h);
    var yb = yTop + h;
    return 'M' + x + ',' + yb + 'V' + (yTop + r) + 'A' + r + ',' + r + ' 0 0 1 ' + (x + r) + ',' + yTop +
      'H' + (x + w - r) + 'A' + r + ',' + r + ' 0 0 1 ' + (x + w) + ',' + (yTop + r) + 'V' + yb + 'Z';
  }
  function placeTip(tip, x, y, W) {
    tip.hidden = false;
    var half = Math.min(tip.offsetWidth / 2 + 4, W / 2);
    tip.style.left = Math.min(W - half, Math.max(half, x)) + 'px';
    tip.style.top = y + 'px';
  }

  function drawQuotaChart(el) {
    var data = quotaSeries();
    var W = Math.max(260, Math.floor(el.clientWidth || 320)), H = 200;
    var m = { l: 42, r: 8, t: 26, b: 26 };
    var pw = W - m.l - m.r, ph = H - m.t - m.b;
    var n = data.length, slot = pw / n;
    var bw = Math.max(6, Math.min(24, slot - 6));
    function y(v) { return m.t + ph * (1 - v); }
    function cx(i) { return m.l + slot * i + slot / 2; }
    function barH(q) { return Math.max(2, ph * q); }
    var parts = [];
    [0, 0.5, 1].forEach(function (v) {
      parts.push('<line class="' + (v === 0 ? 'baseline' : 'gridline') + '" x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + y(v) + '" y2="' + y(v) + '"/>');
      parts.push('<text x="' + (m.l - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + Math.round(v * 100) + ' %</text>');
    });
    var step = Math.max(1, Math.ceil(42 / slot));
    data.forEach(function (d, i) {
      if (d.q != null) parts.push('<path class="bar' + (d.current ? ' partial' : '') + '" data-i="' + i + '" d="' + barPath(cx(i) - bw / 2, y(0) - barH(d.q), bw, barH(d.q)) + '"/>');
      else parts.push('<text x="' + cx(i) + '" y="' + (y(0) - 6) + '" text-anchor="middle">–</text>');
      if ((n - 1 - i) % step === 0) parts.push('<text x="' + cx(i) + '" y="' + (H - 7) + '" text-anchor="middle">KW ' + d.kw + '</text>');
    });
    var li = -1;
    data.forEach(function (d, i) { if (d.q != null) li = i; });
    if (li >= 0) parts.push('<text class="strong" x="' + cx(li) + '" y="' + (y(0) - barH(data[li].q) - 8) + '" text-anchor="middle">' + pct(data[li].q) + '</text>');
    data.forEach(function (d, i) {
      parts.push('<rect class="hit" data-i="' + i + '" x="' + (m.l + slot * i) + '" y="' + (m.t - 12) + '" width="' + slot + '" height="' + (ph + 12) + '" tabindex="0" role="img" aria-label="' + esc('KW ' + d.kw + ': ' + pct(d.q) + ', ' + quotaDetail(d)) + '"/>');
    });
    el.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="group" aria-label="Trainingsquote der letzten 12 Wochen">' + parts.join('') + '</svg><div class="tooltip" hidden></div>';
    var tip = $('.tooltip', el);
    function show(i) {
      var d = data[i];
      $$('.bar', el).forEach(function (b) { b.classList.toggle('active', +b.dataset.i === i); });
      tip.innerHTML = '<span class="v">' + pct(d.q) + '</span><span class="k">KW ' + d.kw + ' · ' + esc(quotaDetail(d)) + '</span>';
      placeTip(tip, cx(i), d.q == null ? y(0) : y(0) - barH(d.q), W);
    }
    function hide() { tip.hidden = true; $$('.bar', el).forEach(function (b) { b.classList.remove('active'); }); }
    $$('.hit', el).forEach(function (r) {
      var i = +r.dataset.i;
      r.addEventListener('pointerenter', function () { show(i); });
      r.addEventListener('pointerdown', function () { show(i); });
      r.addEventListener('focus', function () { show(i); });
      r.addEventListener('blur', hide);
    });
    $('svg', el).addEventListener('pointerleave', hide);
  }

  function niceStep(raw) {
    var c = [0.1, 0.2, 0.5, 1, 2, 5, 10, 20, 50];
    for (var i = 0; i < c.length; i++) if (c[i] >= raw) return c[i];
    return 50;
  }
  function drawWeightChart(el) {
    var all = weightSeries();
    if (all.length < 2) {
      el.innerHTML = '<p class="empty">' + (all.length ? 'Ab dem zweiten Eintrag erscheint hier dein Verlauf.' : 'Trag dein Gewicht auf der Wochenseite ein, dann erscheint hier dein Verlauf.') + '</p>';
      return;
    }
    var last = all[all.length - 1];
    var pts = all.filter(function (p) { return p.date >= addDays(last.date, -119); });
    if (pts.length < 2) pts = all.slice(-2);
    var W = Math.max(260, Math.floor(el.clientWidth || 320)), H = 210;
    var m = { l: 42, r: 66, t: 16, b: 26 };
    var pw = W - m.l - m.r, ph = H - m.t - m.b;
    var x0 = pts[0].date, span = Math.max(1, diffDays(x0, last.date));
    function xs(d) { return m.l + pw * diffDays(x0, d) / span; }
    var lo = Infinity, hi = -Infinity;
    pts.forEach(function (p) { lo = Math.min(lo, p.kg, p.avg); hi = Math.max(hi, p.kg, p.avg); });
    var stp = niceStep((hi - lo) / 3 || 0.5);
    lo = Math.floor(lo / stp) * stp; hi = Math.ceil(hi / stp) * stp;
    if (hi - lo < stp * 2) hi = lo + stp * 2;
    function ys(v) { return m.t + ph * (1 - (v - lo) / (hi - lo)); }
    var dec = stp < 1 ? 1 : 0;
    var parts = [];
    for (var v = lo; v <= hi + 1e-9; v += stp) {
      parts.push('<line class="' + (Math.abs(v - lo) < 1e-9 ? 'baseline' : 'gridline') + '" x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + ys(v) + '" y2="' + ys(v) + '"/>');
      parts.push('<text x="' + (m.l - 8) + '" y="' + (ys(v) + 4) + '" text-anchor="end">' + v.toLocaleString('de-DE', { minimumFractionDigits: dec, maximumFractionDigits: dec }) + '</text>');
    }
    parts.push('<text x="' + xs(x0) + '" y="' + (H - 7) + '" text-anchor="start">' + fmtDate(x0) + '</text>');
    parts.push('<text x="' + xs(last.date) + '" y="' + (H - 7) + '" text-anchor="end">' + fmtDate(last.date) + '</text>');
    if (span >= 28) { var mid = addDays(x0, Math.round(span / 2)); parts.push('<text x="' + xs(mid) + '" y="' + (H - 7) + '" text-anchor="middle">' + fmtDate(mid) + '</text>'); }
    parts.push('<line class="xhair" x1="0" x2="0" y1="' + m.t + '" y2="' + (H - m.b) + '" visibility="hidden"/>');
    parts.push('<path class="avg" d="' + pts.map(function (p, i) { return (i ? 'L' : 'M') + xs(p.date).toFixed(1) + ',' + ys(p.avg).toFixed(1); }).join('') + '"/>');
    pts.forEach(function (p, i) { parts.push('<circle class="dot" data-i="' + i + '" cx="' + xs(p.date).toFixed(1) + '" cy="' + ys(p.kg).toFixed(1) + '" r="4"/>'); });
    parts.push('<text class="strong" x="' + (xs(last.date) + 10) + '" y="' + (ys(last.avg) + 4) + '">' + nf1.format(last.avg) + ' kg</text>');
    parts.push('<rect class="overlay" x="' + m.l + '" y="' + m.t + '" width="' + pw + '" height="' + ph + '" tabindex="0" role="img" aria-label="Gewichtsverlauf, Pfeiltasten für einzelne Werte"/>');
    el.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="group" aria-label="Gewichtsverlauf">' + parts.join('') + '</svg><div class="tooltip" hidden></div>';
    var tip = $('.tooltip', el), xh = $('.xhair', el), ov = $('.overlay', el), cur = pts.length - 1;
    function show(i) {
      cur = i;
      var p = pts[i], x = xs(p.date);
      xh.setAttribute('x1', x); xh.setAttribute('x2', x); xh.setAttribute('visibility', 'visible');
      $$('.dot', el).forEach(function (c) { c.setAttribute('r', +c.dataset.i === i ? 6 : 4); });
      tip.innerHTML = '<span class="k">' + fmtDateY(p.date) + '</span>' +
        '<span class="row-k"><i class="key-dot"></i><b>' + nf1.format(p.kg) + ' kg</b> Messwert</span>' +
        '<span class="row-k"><i class="key-line"></i><b>' + nf1.format(p.avg) + ' kg</b> 7-Tage-Schnitt</span>';
      placeTip(tip, x, Math.min(ys(p.kg), ys(p.avg)) - 4, W);
    }
    function hide() { tip.hidden = true; xh.setAttribute('visibility', 'hidden'); $$('.dot', el).forEach(function (c) { c.setAttribute('r', 4); }); }
    function nearest(clientX) {
      var rect = ov.getBoundingClientRect();
      var px = (clientX - rect.left) / rect.width * pw + m.l;
      var best = 0, bd = Infinity;
      pts.forEach(function (p, i) { var dd = Math.abs(xs(p.date) - px); if (dd < bd) { bd = dd; best = i; } });
      return best;
    }
    ov.addEventListener('pointermove', function (e) { show(nearest(e.clientX)); });
    ov.addEventListener('pointerdown', function (e) { show(nearest(e.clientX)); });
    ov.addEventListener('pointerleave', hide);
    ov.addEventListener('focus', function () { show(cur); });
    ov.addEventListener('blur', hide);
    ov.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowLeft') { e.preventDefault(); show(Math.max(0, cur - 1)); }
      if (e.key === 'ArrowRight') { e.preventDefault(); show(Math.min(pts.length - 1, cur + 1)); }
    });
  }

  /* =========================================================
     Bottom-Sheets
     ========================================================= */
  var sheetStack = [];
  function topSheet() { return sheetStack[sheetStack.length - 1]; }
  function findSheet(kind) { for (var i = sheetStack.length - 1; i >= 0; i--) if (sheetStack[i].kind === kind) return sheetStack[i]; return null; }
  function openSheet(opts) {
    var opener = document.activeElement;
    var wrap = document.createElement('div');
    wrap.className = 'sheet-wrap';
    var hid = 'sh-' + uid();
    wrap.innerHTML = '<div class="sheet-backdrop" data-sheet-close></div>' +
      '<section class="sheet' + (opts.full ? ' full' : '') + '" role="dialog" aria-modal="true" aria-labelledby="' + hid + '">' +
        '<header class="sheet-head"><h2 id="' + hid + '"></h2><button type="button" class="icon-btn" data-sheet-close aria-label="Schließen">' + icon('cross') + '</button></header>' +
        '<div class="sheet-body"></div></section>';
    $('h2', wrap).textContent = opts.title;
    $('#sheets').appendChild(wrap);
    var sh = { wrap: wrap, body: $('.sheet-body', wrap), kind: opts.kind || '', opener: opener };
    sh.close = function () { closeSheet(sh); };
    sh.render = function () { opts.render(sh.body, sh); };
    sh.setTitle = function (t) { $('h2', wrap).textContent = t; };
    sheetStack.push(sh);
    document.body.classList.add('sheet-open');
    wrap.addEventListener('click', function (e) { if (e.target.closest('[data-sheet-close]')) { e.preventDefault(); sh.close(); } });
    sh.render();
    requestAnimationFrame(function () {
      wrap.classList.add('open');
      var f = $('.sheet-head .icon-btn', wrap);
      if (f) f.focus({ preventScroll: true });
    });
    return sh;
  }
  function closeSheet(sh, opts) {
    opts = opts || {};
    var i = sheetStack.indexOf(sh);
    if (i < 0) return;
    sheetStack.splice(i, 1);
    sh.wrap.classList.remove('open');
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    setTimeout(function () { sh.wrap.remove(); }, reduce ? 0 : 240);
    if (!sheetStack.length) document.body.classList.remove('sheet-open');
    if (sh.onClose) sh.onClose();
    if (!opts.silent) renderView();
    var top = topSheet();
    if (top && top.refresh) top.refresh();
    if (sh.opener && document.contains(sh.opener)) { try { sh.opener.focus({ preventScroll: true }); } catch (e) { /* nichts */ } }
  }

  function openPicker(opts) {
    var excluded = {};

    var q = '';
    var bodyEl = null;
    var sh = openSheet({ title: opts.title, full: true, kind: 'picker', render: function (body) {
      bodyEl = body;
      body.innerHTML = '<div class="field"><label for="pickQ" class="vh">Übung suchen</label><input id="pickQ" type="search" placeholder="Übung suchen" autocomplete="off" enterkeyhint="search"></div>' +

        '<div id="pickList" class="list"></div>';

      input.value = q;
      input.addEventListener('input', function () { q = input.value; drawList(); });

    } });
    function drawList() {
      var box = bodyEl && $('#pickList', bodyEl);

        html += '<section class="lib-group"><h3 class="eyebrow">' + esc(CATS[cat].label) + '</h3><ul class="lib-list">' + list.map(function (e) {
