      if (copyBtn) copyBtn.addEventListener('click', function () {
        var src = phaseById($('#phCopy', body).value);
        if (!src) return;
        var hasItems = false;
        for (var d = 1; d <= 7; d++) if (p.days[d].length) hasItems = true;
        function doCopy() {
          for (var d2 = 1; d2 <= 7; d2++) p.days[d2] = (src.days[d2] || []).slice();
          p.reasons = clone(src.reasons || {});
          save(); drawDays(); drawWarn(); $('#phCopyBox', body).innerHTML = '';
          toast('Vorlage übernommen');
        }
        if (!hasItems) { doCopy(); return; }
        $('#phCopyBox', body).innerHTML = '<div class="confirm neutral"><span>Ersetzt die aktuelle Wochenvorlage dieser Phase durch die von „' + esc(src.name) + '“.</span>' +
          '<div class="actions"><button type="button" class="btn primary" id="phCopyYes">Ersetzen</button><button type="button" class="btn" id="phCopyNo">Abbrechen</button></div></div>';
        $('#phCopyYes', body).addEventListener('click', doCopy);
        $('#phCopyNo', body).addEventListener('click', function () { $('#phCopyBox', body).innerHTML = ''; });
      });
      $('#phDel', body).addEventListener('click', function () {
        $('#phDelBox', body).innerHTML = '<div class="confirm"><strong>„' + esc(p.name) + '“ löschen?</strong><span>Die Wochenvorlage geht verloren. Deine bisherigen Häkchen bleiben erhalten.</span>' +
          '<div class="actions"><button type="button" class="btn danger" id="phDelYes">Phase löschen</button><button type="button" class="btn" id="phDelNo">Abbrechen</button></div></div>';
        $('#phDelYes', body).addEventListener('click', function () {
          state.phases = state.phases.filter(function (x) { return x.id !== p.id; });
          save();
          closeSheet(sh);
          toast('Phase gelöscht');
        });
        $('#phDelNo', body).addEventListener('click', function () { $('#phDelBox', body).innerHTML = ''; });
      });
    } });

    function drawInfo() {
      var box = $('#phInfo', bodyEl);
      if (!box) return;
      var today = todayISO();
      var bits = [phaseWeeks(p) + ' ' + plural(phaseWeeks(p), 'Woche', 'Wochen')];
      if (p.start <= today && today <= p.end) bits.push('läuft gerade, Woche ' + phaseWeekNo(p, today));
      else if (p.start > today) bits.push('beginnt ' + inDays(diffDays(today, p.start)));
      else bits.push('beendet');
      var over = state.phases.filter(function (x) { return x.id !== p.id && x.start <= p.end && x.end >= p.start; });
      var txt = bits.join(' · ') + '.';
      if (over.length) txt += ' Überschneidet sich mit ' + over.map(function (x) { return '„' + x.name + '“'; }).join(', ') + '. An gemeinsamen Tagen gilt die später beginnende Phase.';
      box.textContent = txt;
    }
    function drawDays() {
      var box = $('#phDays', bodyEl);
      if (!box) return;
      var html = '';
      for (var d = 1; d <= 7; d++) {
        var list = p.days[d] || [];
        html += '<section class="tpl-day"><div class="tpl-day-head"><span class="tpl-day-name">' + WD_LONG[d - 1] + '</span>' +
          '<button type="button" class="btn small ghost" data-action="tpl-add" data-phase="' + p.id + '" data-day="' + d + '">' + icon('plus') + 'Übung</button></div>';
        if (list.length) {
          html += '<ul class="tpl-items">' + list.map(function (eid, i) {
            var e = exById(eid);
            var nm = e ? e.name : 'Gelöschte Übung';
            return '<li class="tpl-item"><div class="item-main"><span class="item-cat">' + esc(e ? catLabel(e.cat) + (kindLabel(e) ? ' · ' + kindLabel(e) : '') : '') + '</span><span class="item-name">' + esc(nm) + '</span></div>' +
              '<div class="tpl-ctl">' +
                '<button type="button" class="icon-btn" data-action="tpl-move" data-phase="' + p.id + '" data-day="' + d + '" data-idx="' + i + '" data-k="-1" aria-label="' + esc(nm) + ' nach oben"' + (i === 0 ? ' disabled' : '') + '>' + icon('up') + '</button>' +
                '<button type="button" class="icon-btn" data-action="tpl-move" data-phase="' + p.id + '" data-day="' + d + '" data-idx="' + i + '" data-k="1" aria-label="' + esc(nm) + ' nach unten"' + (i === list.length - 1 ? ' disabled' : '') + '>' + icon('down') + '</button>' +
                '<button type="button" class="icon-btn" data-action="tpl-del" data-phase="' + p.id + '" data-day="' + d + '" data-idx="' + i + '" aria-label="' + esc(nm) + ' entfernen">' + icon('cross') + '</button>' +
              '</div></li>';
          }).join('') + '</ul>';
        } else {
          html += '<p class="tpl-empty">Trainingsfrei</p>';
        }
        html += '</section>';
      }
      box.innerHTML = html;
    }
    function drawWarn() {
      var box = $('#phWarn', bodyEl);
      if (!box) return;
      var warns = ruleCheck(p);
      if (!warns.length) { box.innerHTML = '<p class="ok-line">' + icon('check') + 'Reihenfolge und Regeneration passen.</p>'; return; }
      box.innerHTML = warns.map(function (w) {
        var ok = !!w.reason.trim();
        return '<div class="warn-card' + (ok ? ' justified' : '') + '"><div class="warn-title">' + icon(ok ? 'check' : 'alert') + esc(w.title) + (ok ? ' · begründet' : '') + '</div>' +
          '<p>' + esc(w.text) + '</p>' +
          '<label class="label" for="pr-' + w.key + '">Begründung, falls bewusst so geplant</label>' +
          '<textarea id="pr-' + w.key + '" data-reason-key="' + w.key + '" rows="2" placeholder="z. B. Oberkörper und Unterkörper getrennt">' + esc(w.reason) + '</textarea></div>';
      }).join('');
    }
    sh.refresh = function () { drawDays(); drawWarn(); drawInfo(); };
    sh.phaseId = p.id;
    return sh;
  }

        '<p class="form-error" id="tErr" hidden></p>' +
        '<div class="actions"><button type="button" class="btn primary" id="tSave">Speichern</button>' +
          (!isNew ? '<button type="button" class="btn danger" id="tDel">' + icon('trash') + 'Löschen</button>' : '') + '</div>' +
        '<div id="tDelBox"></div>';
      function readResult() {
        return {
          placement: parseInt0($('#tPlacement', body).value),
          participants: parseInt0($('#tParticipants', body).value),
          wins: parseInt0($('#tWins', body).value),
          losses: parseInt0($('#tLosses', body).value),
          hitsFor: parseInt0($('#tHitsFor', body).value),
          hitsAgainst: parseInt0($('#tHitsAgainst', body).value),
          bilateral: parseInt0($('#tBilateral', body).value),
          rating: parseNum($('#tRating', body).value)
        };
      }
      function derived() {
        var ts = tStats({ result: readResult() });
        var bits = [];
        if (ts.winRate != null) bits.push('Siegquote ' + pct(ts.winRate));
        if (ts.balance != null) bits.push('Trefferbilanz ' + (ts.balance > 0 ? '+' : ts.balance < 0 ? '−' : '±') + Math.abs(ts.balance));
        if (ts.bilPerFight != null) bits.push(nfMax1.format(ts.bilPerFight) + ' Doppeltreffer/Nachschläge pro Kampf');
        $('#tDerived', body).textContent = bits.join(' · ');

      derived();
      body.addEventListener('input', function (e) { if (e.target.type === 'number' || e.target.id === 'tRating') derived(); });

        var r = readResult(), clean = {};
        Object.keys(r).forEach(function (k) { if (r[k] != null) clean[k] = r[k]; });
        t.result = clean;
        if (isNew) state.tournaments.push(t); else Object.assign(src, t);
        save();
        closeSheet(sh);
        toast('Turnier gespeichert');
      });
      var del = $('#tDel', body);
      if (del) del.addEventListener('click', function () {
        $('#tDelBox', body).innerHTML = '<div class="confirm"><strong>„' + esc(t.name) + '“ löschen?</strong><span>Termin und Ergebnis werden entfernt.</span>' +

        $('#tDelYes', body).addEventListener('click', function () {
          state.tournaments = state.tournaments.filter(function (x) { return x.id !== t.id; });
          save(); closeSheet(sh); toast('Turnier gelöscht');
        });
        $('#tDelNo', body).addEventListener('click', function () { $('#tDelBox', body).innerHTML = ''; });
      });
    } });
    return sh;
  }

  function openShareSheet() {

      body.innerHTML = '<div class="field"><label for="shareText">Text, den du verschickst (änderbar)</label><textarea id="shareText" rows="9">' + esc(summaryText(monday)) + '</textarea></div>' +
        '<label class="check" for="shareWeight"><input type="checkbox" id="shareWeight"' + (state.settings.shareWeight ? ' checked' : '') + '>Gewicht mitschicken</label>' +

        '<p class="hint">Die App verschickt nichts von selbst. Beim Teilen öffnet sich das Teilen-Menü deines Handys, und du wählst App und Empfänger.</p>';

          var pr;

            if (err && err.name === 'AbortError') return;
            copyText(text, $('#shareText', body)).then(function (ok) { toast(ok ? 'Text kopiert. Füge ihn in deinem Messenger ein.' : 'Text ist markiert. Kopiere ihn bitte selbst.'); });
          });
        } else {
          copyText(text, $('#shareText', body)).then(function (ok) { toast(ok ? 'Text kopiert. Füge ihn in deinem Messenger ein.' : 'Text ist markiert. Kopiere ihn bitte selbst.'); });
        }
      });
      $('#shareCopy', body).addEventListener('click', function () {
        copyText($('#shareText', body).value, $('#shareText', body)).then(function (ok) { toast(ok ? 'Text kopiert' : 'Text ist markiert. Kopiere ihn bitte selbst.'); });
      });
    } });
  }

      });
      html += '<section class="cfg-group"><h3 class="section-title">Tests</h3>' + state.diag.tests.map(function (t) {

          (t.kind === 'number' ? '<div class="row"><div class="field"><label for="tu-' + t.id + '">Einheit</label><input id="tu-' + t.id + '" type="text" autocomplete="off" data-ct="' + esc(t.id) + '" data-f="unit" value="' + esc(t.unit) + '" placeholder="z. B. cm"></div>' +
            '<div class="field"><label for="tb-' + t.id + '">Besser ist</label><select id="tb-' + t.id + '" data-ct="' + esc(t.id) + '" data-f="better"><option value="higher"' + (t.better === 'higher' ? ' selected' : '') + '>mehr</option><option value="lower"' + (t.better === 'lower' ? ' selected' : '') + '>weniger</option></select></div></div>' : '<span class="hint">Auswahl: ' + t.options.map(function (o) { return esc(o.short); }).join(' · ') + '</span>') +
          '</div><button type="button" class="icon-btn" data-cfg-deltest="' + esc(t.id) + '" aria-label="' + esc(t.name) + ' entfernen">' + icon('cross') + '</button></div>';
      }).join('') + '<div class="actions"><button type="button" class="btn small" data-cfg-addtest>' + icon('plus') + 'Test</button></div></section>' +
        '<button type="button" class="btn primary block" data-sheet-close>Fertig</button>';

    } });
    sh.body.addEventListener('input', function (e) {
      var t = e.target, id = t.getAttribute('data-ci'), tid = t.getAttribute('data-ct'), f = t.getAttribute('data-f');
      if (id) { var it = diagItem(id); if (it && f) { it[f] = f === 'name' ? (t.value.trim() || it[f]) : t.value; saveSoon(); } }
      if (tid) { var tt = state.diag.tests.filter(function (x) { return x.id === tid; })[0]; if (tt && f) { tt[f] = f === 'name' ? (t.value.trim() || tt[f]) : t.value; saveSoon(); } }
    });
    sh.body.addEventListener('change', function (e) {
      var t = e.target, tid = t.getAttribute('data-ct');
      if (tid && t.getAttribute('data-f') === 'better') { var tt = state.diag.tests.filter(function (x) { return x.id === tid; })[0]; if (tt) { tt.better = t.value; save(); } }
    });
    sh.body.addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b) return;
      if (b.hasAttribute('data-cfg-add')) {
        var ni = { id: 'q' + uid(), area: b.getAttribute('data-cfg-add'), name: 'Neue Qualität', desc: '' };
        state.diag.items.push(ni); save(); sh.render();
        var inp = $('#cn-' + ni.id, sh.body); if (inp) { inp.focus(); inp.select(); }
      } else if (b.hasAttribute('data-cfg-del')) {
        var did = b.getAttribute('data-cfg-del');
        state.diag.items = state.diag.items.filter(function (x) { return x.id !== did; });
        save(); sh.render(); toast('Frage entfernt');
      } else if (b.hasAttribute('data-cfg-addtest')) {
        var nt = { id: 't' + uid(), name: 'Neuer Test', kind: 'number', unit: '', better: 'higher', hint: '' };
        state.diag.tests.push(nt); save(); sh.render();
        var tin = $('#tn-' + nt.id, sh.body); if (tin) { tin.focus(); tin.select(); }
      } else if (b.hasAttribute('data-cfg-deltest')) {
        var dt = b.getAttribute('data-cfg-deltest');
        state.diag.tests = state.diag.tests.filter(function (x) { return x.id !== dt; });
        save(); sh.render(); toast('Test entfernt');
      }
    });
    return sh;
  }

  /* ---------- Ziel bearbeiten ---------- */
  function openGoalEditor(id, prefill) {

    var bodyEl = null;
    var sh = openSheet({ title: isNew ? 'Neues Ziel' : 'Ziel', full: true, kind: 'goal', render: function (body) {
      bodyEl = body;
      var diagOpts = AREAS.map(function (ar) {
        var its = state.diag.items.filter(function (i) { return i.area === ar[0]; });

        '<div id="glTechBox"></div>' +
        '<div class="field"><label for="glMeasure">Woran merkst du, dass du es erreicht hast?</label><input id="glMeasure" type="text" autocomplete="off" placeholder="messbar, z. B. Platz 1–8 oder ≥ 50 % in 3 Sparrings"></div>' +
        '<div class="field"><label for="glWhy">Warum ist es dir wichtig?</label><textarea id="glWhy" rows="2"></textarea></div>' +
        '<div class="field"><label for="glNeed">Welches Bedürfnis steckt dahinter?</label><select id="glNeed"><option value="">– offen lassen –</option>' + Object.keys(NEEDS).map(function (k) { return '<option value="' + k + '">' + NEEDS[k] + '</option>'; }).join('') + '</select></div>' +
        '<div class="field"><label for="glReal">Was macht es realistisch? Was brauchst du dafür?</label><textarea id="glReal" rows="2"></textarea></div>' +
        '<div class="row"><div class="field"><label for="glDeadline">Bis wann?</label><input id="glDeadline" type="date"></div><div class="field"><label for="glReview">Rückschau am</label><input id="glReview" type="date"></div></div>' +
        '<div class="field" id="glParentField"><label for="glParent">Zahlt ein auf</label><select id="glParent"></select></div>' +
        '<div class="field"><label for="glDiag">Bezug zur Diagnostik</label><select id="glDiag"><option value="">– keiner –</option>' + diagOpts + '</select></div>' +
        '<h3 class="section-title">Maßnahmen</h3><p class="hint">Was tust du konkret dafür? Mit „Einplanen“ landet eine Maßnahme als Übung in deiner Wochenvorlage.</p>' +
        '<div id="glMeasures" class="list"></div><div class="actions"><button type="button" class="btn small" id="glAddMeasure">' + icon('plus') + 'Maßnahme</button></div>' +
        '<div id="glSessions"></div>' +
        '<div id="glStatus"></div>' +
        '<p class="form-error" id="glErr" hidden></p>' +
        '<div class="actions"><button type="button" class="btn primary" id="glSave">Speichern</button>' + (!isNew ? '<button type="button" class="btn danger" id="glDel">' + icon('trash') + 'Löschen</button>' : '') + '</div><div id="glDelBox"></div>';
      $('#glTitle', body).value = g.title;
      $('#glTech', body).checked = !!g.technik;
      $('#glMeasure', body).value = g.measure;
      $('#glWhy', body).value = g.why;
      $('#glNeed', body).value = g.need;
      $('#glReal', body).value = g.realistic;
      $('#glDeadline', body).value = g.deadline;
      $('#glReview', body).value = g.review;
      $('#glDiag', body).value = g.diag;
      drawLevel(); drawTech(); drawParent(); drawMeasures(); drawSessions(); drawStatus();

      $('#glLevels', body).addEventListener('click', function (e) {
        var b = e.target.closest('[data-lv]');
        if (!b) return;

      });
      $('#glTech', body).addEventListener('change', function (e) {
        if (e.target.checked) {
          g.technik = g.technik || { target: 50, streak: 3, min: 5 };

          if (!m.value.trim()) m.value = techCriterion(g.technik);
        } else g.technik = null;
        drawTech(); drawSessions();
      });
      $('#glAddMeasure', body).addEventListener('click', function () {
        var nm = { id: uid(), text: '', exId: null };
        g.measures.push(nm);
        drawMeasures();
        var inp = $('[data-m="' + nm.id + '"]', body); if (inp) inp.focus();
      });
      body.addEventListener('input', function (e) {
        var t = e.target;
        var mid = t.getAttribute('data-m');
        if (mid) { var m = g.measures.filter(function (x) { return x.id === mid; })[0]; if (m) m.text = t.value; }
        var tk = t.getAttribute('data-tk');
        if (tk && g.technik) {
          g.technik[tk] = clampInt(t.value, 1, tk === 'target' ? 100 : 200, g.technik[tk]);
        }
      });
      body.addEventListener('click', function (e) {
        var b = e.target.closest('button');
        if (!b) return;
        if (b.hasAttribute('data-plan')) {
          var m = g.measures.filter(function (x) { return x.id === b.getAttribute('data-plan'); })[0];
          if (!m) return;
          if (!m.text.trim()) { toast('Beschreib die Maßnahme zuerst.'); return; }
          openScheduleSheet(m.text.trim(), m.exId, function (exId) { m.exId = exId; if (!isNew) { var sm = src.measures.filter(function (x) { return x.id === m.id; })[0]; if (sm) { sm.exId = exId; save(); } } drawMeasures(); });
        } else if (b.hasAttribute('data-mdel')) {
          var did = b.getAttribute('data-mdel');
          g.measures = g.measures.filter(function (x) { return x.id !== did; });
          drawMeasures();
        } else if (b.hasAttribute('data-sdel') && src) {
          var sid = b.getAttribute('data-sdel');
          src.sessions = src.sessions.filter(function (x) { return x.id !== sid; });
          g.sessions = clone(src.sessions);
          save(); drawSessions(); toast('Sparring gelöscht');
        } else if (b.id === 'glAddSession' && src) {
          openSessionSheet(src.id, function () { g.sessions = clone(src.sessions); drawSessions(); drawStatus(); });
        } else if (b.hasAttribute('data-st') && src) {
          if (!commit()) return;
          var st = b.getAttribute('data-st');
          src.status = st; g.status = st;
          src.closedAt = g.closedAt = st === 'offen' ? '' : todayISO();
          save(); drawStatus();
          toast(st === 'erreicht' ? 'Glückwunsch, Ziel erreicht!' : st === 'nicht' ? 'Ziel abgeschlossen. Notier dir, was du mitnimmst.' : 'Ziel wieder offen');
        }
      });
      $('#glSave', body).addEventListener('click', function () {
        if (!commit()) return;
        closeSheet(sh);
        toast(isNew ? 'Ziel angelegt' : 'Ziel gespeichert');

      var del = $('#glDel', body);
      if (del) del.addEventListener('click', function () {
        $('#glDelBox', body).innerHTML = '<div class="confirm"><strong>Ziel löschen?</strong><span>Auch eingetragene Sparrings dieses Ziels werden gelöscht. Eingeplante Übungen bleiben im Plan.</span>' +
          '<div class="actions"><button type="button" class="btn danger" id="glDelYes">Löschen</button><button type="button" class="btn" id="glDelNo">Abbrechen</button></div></div>';
        $('#glDelYes', body).addEventListener('click', function () {
          state.goals = state.goals.filter(function (x) { return x.id !== g.id; });
          state.goals.forEach(function (x) { if (x.parent === g.id) x.parent = ''; });
          save(); closeSheet(sh); toast('Ziel gelöscht');
        });
        $('#glDelNo', body).addEventListener('click', function () { $('#glDelBox', body).innerHTML = ''; });
      });
    } });

    function readForm() {
      var b = bodyEl;
      g.title = $('#glTitle', b).value.trim();
      g.measure = $('#glMeasure', b).value.trim();
      g.why = $('#glWhy', b).value.trim();
      g.need = $('#glNeed', b).value;
      g.realistic = $('#glReal', b).value.trim();
      g.deadline = $('#glDeadline', b).value;
      g.review = $('#glReview', b).value;
      g.parent = g.level === 'traum' ? '' : ($('#glParent', b).value || '');
      g.diag = $('#glDiag', b).value;
      var rf = $('#glRefl', b);
      if (rf) g.reflection = rf.value.trim();
      g.measures = g.measures.filter(function (m) { return m.text.trim() || m.exId; }).map(function (m) { m.text = m.text.trim(); return m; });
    }
    function commit() {
      readForm();
      var er = $('#glErr', bodyEl);
      if (!g.title) { er.textContent = 'Bitte formuliere das Ziel.'; er.hidden = false; $('#glTitle', bodyEl).focus(); return false; }
      er.hidden = true;
      if (isNew) { state.goals.push(g); src = g; isNew = false; g = clone(src); }
      else { var keepSessions = src.sessions; Object.assign(src, clone(g)); src.sessions = keepSessions; g.sessions = clone(keepSessions); }
      save();
      return true;
    }
    function drawLevel() {
      $$('#glLevels [data-lv]', bodyEl).forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-lv') === g.level)); });
      $('#glLvHint', bodyEl).textContent = GOAL_LEVELS[g.level].hint;
    }
    function drawTech() {
      var box = $('#glTechBox', bodyEl);
      if (!g.technik) { box.innerHTML = ''; return; }
      box.innerHTML = '<div class="confirm neutral">' +
        '<div class="row"><div class="field"><label for="glTarget">Zielquote in %</label><input id="glTarget" type="number" inputmode="numeric" min="1" max="100" data-tk="target" value="' + g.technik.target + '"></div>' +
        '<div class="field"><label for="glStreak">Sparrings in Folge</label><input id="glStreak" type="number" inputmode="numeric" min="1" max="20" data-tk="streak" value="' + g.technik.streak + '"></div>' +
        '<div class="field"><label for="glMin">mind. Versuche je Sparring</label><input id="glMin" type="number" inputmode="numeric" min="1" max="200" data-tk="min" value="' + g.technik.min + '"></div></div>' +
        '<span class="hint">Unter 30 % frustriert, über 70 % ist es zu leicht. Ein Ziel um 50 % hält dich in der Lernzone.</span></div>';
    }
    function drawParent() {
      var field = $('#glParentField', bodyEl), sel = $('#glParent', bodyEl);
      var higher = g.level === 'prozess' ? ['traum', 'leistung'] : g.level === 'leistung' ? ['traum'] : [];
      var opts = state.goals.filter(function (x) { return x.id !== g.id && x.status === 'offen' && higher.indexOf(x.level) >= 0; });
      field.hidden = !higher.length;
      sel.innerHTML = '<option value="">– keinem –</option>' + opts.map(function (x) { return '<option value="' + x.id + '">' + esc(GOAL_LEVELS[x.level].label + ': ' + x.title) + '</option>'; }).join('');
      sel.value = opts.some(function (x) { return x.id === g.parent; }) ? g.parent : '';
    }
    function drawMeasures() {
      var box = $('#glMeasures', bodyEl);
      if (!g.measures.length) { box.innerHTML = '<p class="empty">Noch keine Maßnahmen.</p>'; return; }
      box.innerHTML = g.measures.map(function (m) {
        var info = m.exId ? plannedInfo(m.exId) : '';
        return '<div class="measure-row"><label class="vh" for="m-' + m.id + '">Maßnahme</label><input id="m-' + m.id + '" type="text" autocomplete="off" data-m="' + m.id + '" value="' + esc(m.text) + '" placeholder="z. B. Krumphau-Drill mit Partner">' +
          '<div class="measure-tools"><button type="button" class="btn small" data-plan="' + m.id + '">' + (info ? 'Ändern' : 'Einplanen') + '</button><button type="button" class="icon-btn" data-mdel="' + m.id + '" aria-label="Maßnahme entfernen">' + icon('cross') + '</button></div>' +
          (info ? '<span class="hint">' + icon('check') + ' eingeplant: ' + esc(info) + '</span>' : '') + '</div>';
      }).join('');
    }
    function drawSessions() {
      var box = $('#glSessions', bodyEl);
      if (!g.technik) { box.innerHTML = ''; return; }
      if (isNew) { box.innerHTML = '<p class="hint">Nach dem Speichern kannst du Sparrings eintragen.</p>'; return; }
      var ts = techStats(g);
      var rows = ts.sessions.slice().reverse();
      box.innerHTML = '<h3 class="section-title">Sparrings</h3>' +
        (ts.zone ? '<div class="notice ' + (ts.zone === 'lern' ? 'info' : '') + '"><span><strong>' + ZONES[ts.zone].label + ':</strong> ' + ZONES[ts.zone].text + '</span></div>' : '') +
        (rows.length ? '<div class="table-wrap"><table><thead><tr><th>Datum</th><th class="num">Treffer</th><th class="num">Quote</th><th></th></tr></thead><tbody>' + rows.map(function (s) {
          return '<tr><td>' + fmtDateY(s.date) + (s.note ? '<br><span class="small muted">' + esc(s.note) + '</span>' : '') + '</td><td class="num">' + s.h + '/' + s.a + '</td><td class="num">' + pct(s.h / s.a) + '</td>' +
            '<td class="num"><button type="button" class="icon-btn" data-sdel="' + s.id + '" aria-label="Sparring vom ' + fmtDate(s.date) + ' löschen">' + icon('cross') + '</button></td></tr>';
        }).join('') + '</tbody></table></div>' : '<p class="empty">Noch kein Sparring eingetragen.</p>') +
        '<div class="actions"><button type="button" class="btn" id="glAddSession">' + icon('plus') + 'Sparring eintragen</button></div>';
    }
    function drawStatus() {
      var box = $('#glStatus', bodyEl);
      if (isNew) { box.innerHTML = ''; return; }
      var ts = g.technik ? techStats(g) : null;
      var now = g.status === 'erreicht' ? '<span class="chip ok">' + icon('check') + 'erreicht am ' + fmtDateY(g.closedAt || todayISO()) + '</span>' :
        g.status === 'nicht' ? '<span class="chip missed">nicht erreicht · ' + fmtDateY(g.closedAt || todayISO()) + '</span>' : '<span class="chip">offen</span>';
      box.innerHTML = '<h3 class="section-title">Status</h3><div class="actions">' + now + '</div>' +
        (ts && ts.met && g.status === 'offen' ? '<p class="ok-line">' + icon('check') + 'Kriterium erfüllt: ' + esc(techCriterion(g.technik)) + '</p>' : '') +
        '<div class="actions">' + (g.status === 'offen' ?
          '<button type="button" class="btn primary" data-st="erreicht">' + icon('check') + 'Erreicht</button><button type="button" class="btn" data-st="nicht">Nicht erreicht</button>' :
          '<button type="button" class="btn" data-st="offen">Wieder öffnen</button>') + '</div>' +
        '<div class="field"><label for="glRefl">Rückblick: Was nimmst du mit?</label><textarea id="glRefl" rows="3" placeholder="Was hat geholfen? Was machst du beim nächsten Ziel anders?">' + esc(g.reflection) + '</textarea></div>';
    }
    return sh;
  }

  /* ---------- Maßnahme einplanen ---------- */
  function openScheduleSheet(text, exId, onDone) {
    var phases = state.phases.slice().sort(function (a, b) { return a.start < b.start ? -1 : 1; });
    if (!phases.length) { toast('Leg zuerst unter „Plan“ eine Phase an.'); return; }
    var today = todayISO();
    var cur = phaseFor(today) || phases.filter(function (p) { return p.start > today; })[0] || phases[phases.length - 1];
    var ex = exId ? exById(exId) : null;
    var sh = openSheet({ title: 'Maßnahme einplanen', kind: 'schedule', render: function (body) {
      body.innerHTML = '<p class="lead">' + esc(text) + '</p>' +
        (ex ? '<p class="hint">Übung im Plan: ' + esc(ex.name) + '</p>' :
          '<div class="field"><label for="scCat">Kategorie der neuen Übung</label><select id="scCat">' + CAT_ORDER.map(function (k) { return '<option value="' + k + '"' + (k === 'technik' ? ' selected' : '') + '>' + CATS[k].label + '</option>'; }).join('') + '</select></div>') +
        '<div class="field"><label for="scPhase">Phase</label><select id="scPhase">' + phases.map(function (p) {
          return '<option value="' + p.id + '"' + (p.id === cur.id ? ' selected' : '') + '>' + esc(p.name) + ' (' + fmtDate(p.start) + '–' + fmtDateY(p.end) + ')</option>';
        }).join('') + '</select></div>' +
        '<div class="field"><span class="label" id="scDaysLbl">An welchen Tagen?</span><div class="day-toggles" role="group" aria-labelledby="scDaysLbl" id="scDays"></div></div>' +
        '<p class="form-error" id="scErr" hidden></p>' +
        '<div class="actions"><button type="button" class="btn primary" id="scGo">Speichern</button></div>';
      function drawDays() {
        var p = phaseById($('#scPhase', body).value);
        $('#scDays', body).innerHTML = WD.map(function (d, i) {
          var on = !!(ex && p && (p.days[i + 1] || []).indexOf(ex.id) >= 0);
          return '<button type="button" data-day="' + (i + 1) + '" aria-pressed="' + on + '" aria-label="' + WD_LONG[i] + '">' + d + '</button>';
        }).join('');
      }
      drawDays();
      $('#scPhase', body).addEventListener('change', drawDays);
      $('#scDays', body).addEventListener('click', function (e) {
        var b = e.target.closest('[data-day]');
        if (b) b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed') !== 'true'));
      });
      $('#scGo', body).addEventListener('click', function () {
        var p = phaseById($('#scPhase', body).value);
        var on = $$('#scDays [data-day]', body).filter(function (b) { return b.getAttribute('aria-pressed') === 'true'; }).map(function (b) { return +b.getAttribute('data-day'); });
        if (!ex && !on.length) { var er = $('#scErr', body); er.textContent = 'Wähl mindestens einen Tag.'; er.hidden = false; return; }
        if (!ex) {
          ex = { id: uid(), name: text, cat: $('#scCat', body).value, kind: '', dose: '', note: 'Maßnahme aus deinen Zielen' };
          state.exercises.push(ex);
        }
        for (var d = 1; d <= 7; d++) {
          var list = p.days[d] || (p.days[d] = []);
          var has = list.indexOf(ex.id) >= 0;
          if (on.indexOf(d) >= 0 && !has) list.push(ex.id);
          if (on.indexOf(d) < 0 && has) p.days[d] = list.filter(function (x) { return x !== ex.id; });
        }
        save();
        closeSheet(sh, { silent: true });
        toast(on.length ? 'Eingeplant: ' + p.name + ', ' + on.map(function (d) { return WD[d - 1]; }).join(', ') : 'Aus „' + p.name + '“ herausgenommen');
        if (onDone) onDone(ex.id);
        renderView();
      });
    } });
    return sh;
  }

  /* ---------- Sparring eintragen ---------- */
  function openSessionSheet(goalId, onDone) {
    var g = goalById(goalId);
    if (!g || !g.technik) return;
    function counter(idk, label) {

  function copyText(text, selectEl) {
    var p;
    try { p = navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(text) : Promise.reject(new Error('no clipboard')); }
    catch (e) { p = Promise.reject(e); }
    return p.then(function () { return true; }).catch(function () {
      var ok = false;
      var ta = selectEl;
      var temp = false;
      if (!ta) { ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); temp = true; }
      try { ta.focus(); ta.select(); ok = document.execCommand('copy'); } catch (e) { ok = false; }
      if (temp) ta.remove();
      return ok;
    });
  }
  function saveFile(text, filename, title) {
    if (IN_FRAME) return Promise.resolve('unsupported');
    try {
      var file = new File([text], filename, { type: 'application/json' });
      if (navigator.canShare && navigator.share && navigator.canShare({ files: [file] })) {
        return navigator.share({ files: [file], title: title }).then(function () { return 'shared'; }).catch(function (e) {
          return e && e.name === 'AbortError' ? 'aborted' : download();
        });
      }
    } catch (e) { /* weiter mit Download */ }
    return Promise.resolve(download());
    function download() {
      try {
        var url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
        var a = document.createElement('a');
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
        return 'downloaded';
      } catch (e) { return 'unsupported'; }
    }
  }
  function buildBackup() { return { app: 'fechtbuch', kind: 'backup', v: 1, exportedAt: new Date().toISOString(), data: state }; }
  function buildTemplate() {
    return {
      app: 'fechtbuch', kind: 'vorlage', v: 1, exportedAt: new Date().toISOString(),
      exercises: state.exercises.map(function (e) { return { id: e.id, name: e.name, cat: e.cat, kind: e.kind, dose: e.dose, note: e.note }; }),
      phases: state.phases.map(function (p) { return { id: p.id, name: p.name, type: p.type, start: p.start, end: p.end, days: p.days, reasons: p.reasons }; })
    };
  }
  function markBackup() { state.settings.lastBackup = todayISO(); save(); renderTopbar(); }
  function parseImport(text) {
    var obj;
    try { obj = JSON.parse(String(text).trim()); } catch (e) { throw new Error('Das ist kein gültiges Fechtbuch-Backup.'); }
    if (!obj || obj.app !== 'fechtbuch') throw new Error('Diese Datei stammt nicht aus dem Fechtbuch.');
    if (obj.kind === 'backup' && isObj(obj.data)) return { kind: 'backup', data: normalize(obj.data), exportedAt: obj.exportedAt };
    if (obj.kind === 'vorlage' && Array.isArray(obj.exercises) && Array.isArray(obj.phases)) {
      var tmp = normalize({ exercises: obj.exercises, phases: obj.phases });
      return { kind: 'vorlage', exercises: tmp.exercises, phases: tmp.phases, exportedAt: obj.exportedAt };
    }
    throw new Error('Unbekanntes Dateiformat.');
  }
  function applyTemplate(t, mode) {
    var map = {};
    t.exercises.forEach(function (e) {
      var hit = state.exercises.filter(function (x) { return x.cat === e.cat && x.name.trim().toLowerCase() === e.name.trim().toLowerCase(); })[0];
      if (hit) map[e.id] = hit.id;
      else { var ne = { id: uid(), name: e.name, cat: e.cat, kind: e.kind, dose: e.dose, note: e.note }; state.exercises.push(ne); map[e.id] = ne.id; }
    });
    var starts = t.phases.map(function (p) { return p.start; }).sort();
    var shift = starts.length ? diffDays(starts[0], mondayOf(todayISO())) : 0;
    if (mode === 'replace') state.phases = [];
    t.phases.forEach(function (p) {
      var np = { id: uid(), name: p.name, type: p.type, start: addDays(p.start, shift), end: addDays(p.end, shift), days: emptyDays(), reasons: clone(p.reasons || {}) };
      for (var d = 1; d <= 7; d++) np.days[d] = (p.days[d] || []).map(function (id) { return map[id]; }).filter(Boolean);
      state.phases.push(np);
    });
    state.settings.example = false;
    state.settings.welcome = false;
  }

    },
    'import-paste': function () { pendingImport = 'paste'; drawImport(); var t = $('#importText'); if (t) t.focus(); },
    'import-check': function () {
      var t = $('#importText');
      try { pendingImport = parseImport(t ? t.value : ''); drawImport(); }
      catch (e) { pendingImport = null; drawImport(e.message); }
    },
    'import-cancel': function () { pendingImport = null; drawImport(); },
    'import-apply': function (el) {
      var imp = pendingImport;
      if (!imp || typeof imp !== 'object') return;
      if (imp.kind === 'backup') {
        state = imp.data;
        save();
        pendingImport = null;
        var s = settingsSheet(); if (s) closeSheet(s, { silent: true });
        render();
        toast('Backup wiederhergestellt');
      } else {
        applyTemplate(imp, el.dataset.k === 'replace' ? 'replace' : 'add');
        save();
        pendingImport = null;
        var s2 = settingsSheet(); if (s2) closeSheet(s2, { silent: true });
        ui.tab = 'plan'; ui.planTab = 'phasen'; saveUI();
        render();
        toast('Vorlage importiert');
      }
    },
    persist: function () {
      if (!navigator.storage || !navigator.storage.persist) { toast('Dieser Browser unterstützt das nicht.'); return; }
      navigator.storage.persist().then(function (ok) {
        state.settings.persistAsked = true; save();
        toast(ok ? 'Speicher ist geschützt' : 'Der Browser hat abgelehnt. Backups bleiben wichtig.');
        var s = settingsSheet(); if (s) s.refresh();
      }).catch(function () { toast('Anfrage nicht möglich.'); });
    },
    'reset-ask': function () {
      var s = settingsSheet(); if (!s) return;
      $('#resetBox', s.body).innerHTML = '<div class="confirm"><strong>Wirklich alles löschen?</strong><span>Das lässt sich nicht rückgängig machen. Sichere vorher ein Backup, wenn du die Daten noch brauchst.</span>' +
        '<div class="actions"><button type="button" class="btn danger" data-action="reset-confirm">Ja, alles löschen</button><button type="button" class="btn" data-action="reset-cancel">Abbrechen</button></div></div>';
    },
    'reset-cancel': function () { var s = settingsSheet(); if (s) $('#resetBox', s.body).innerHTML = ''; },
    'reset-confirm': function () {
      state = defaultState();
      save();
      var s = settingsSheet(); if (s) closeSheet(s, { silent: true });
      ui.tab = 'woche'; ui.weekOffset = 0; saveUI();
      render();
      toast('Alle Daten gelöscht');
    }
  };

  function handleImportFile(input) {
    var f = input.files && input.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      try { pendingImport = parseImport(reader.result); drawImport(); }
      catch (e) { pendingImport = null; drawImport(e.message); }
      input.value = '';
    };
    reader.onerror = function () { drawImport('Die Datei ließ sich nicht lesen.'); };
    reader.readAsText(f);
  }

  var toastTimer = null;
  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2800);
  }

  /* =========================================================
     Start
     ========================================================= */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el || el.disabled) return;
    var fn = ACTIONS[el.dataset.action];
    if (!fn) return;
    e.preventDefault();
    fn(el, e);
  });
  document.addEventListener('submit', function (e) {
    if (e.target && e.target.id === 'weightForm') { e.preventDefault(); saveWeight(); }
  });
  document.addEventListener('change', function (e) {
    if (e.target && e.target.id === 'importFile') handleImportFile(e.target);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && sheetStack.length) { e.preventDefault(); closeSheet(topSheet()); }
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) save(); else if (!sheetStack.length) renderView();
  });
  window.addEventListener('pagehide', function () { save(); });
  window.addEventListener('resize', debounce(function () { if (ui.tab === 'verlauf' || ui.tab === 'ziele' || ui.tab === 'diagnostik') drawCharts(); }, 150));

  storageOK = storageTest();
  state = storageOK ? loadState() : null;
  if (!state) {
    state = defaultState();
    seedExample(state);
    save();
  }
  if (!TABS.some(function (t) { return t[0] === ui.tab; })) ui.tab = 'woche';
  if (!PLAN_TABS.some(function (t) { return t[0] === ui.planTab; })) ui.planTab = 'phasen';
  render();

  // Offline-Speicher für die App-Dateien: nur in der veröffentlichten Version (GitHub Pages),
  // erkennbar am Web-App-Manifest. Trainingsdaten liegen weiterhin nur im Browser-Speicher.
  if ('serviceWorker' in navigator && !IN_FRAME && document.querySelector('link[rel="manifest"]') &&
      (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    navigator.serviceWorker.register('sw.js').catch(function () { /* nichts */ });
  }

  // Für automatisierte Tests: Zugriff auf Kernfunktionen (keine Netzwerkfunktion)
  window.__fechtbuch = { state: function () { return state; }, weekStats: weekStats, ruleCheck: ruleCheck, planDates: planDates, isoWeek: isoWeek };
})();
</script>

</body>
